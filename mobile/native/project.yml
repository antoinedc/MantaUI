name: MantaUI
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
# Crash capture is Firebase Crashlytics. It replaced PLCrashReporter (which
# wrote a report locally and uploaded it to the box on the next launch) because
# the two cannot coexist: both install Mach exception handlers, they fight over
# the same task exception port, and the loser silently drops the crash you
# needed. Crashlytics was chosen over keeping PLCrashReporter for the grouping,
# cross-user impact data, and the agent-readable MCP surface.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.17.0"
  MessagingUI:
    url: https://github.com/FluidGroup/swiftui-messaging-ui
    from: "1.0.0"
  MarkdownView:
    url: https://github.com/LiYanan2004/MarkdownView
    exactVersion: "3.0.0"
targets:
  MantaUI:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # NOTE the exclude + folder pair below: the terminal page is loaded with
      # `Bundle.main.url(forResource:"terminal", withExtension:"html",
      # subdirectory:"terminal")`, which only resolves if the directory SURVIVES
      # into the bundle. Listed as ordinary sources, xcodegen emits one file
      # reference per file and Copy Bundle Resources FLATTENS them to the bundle
      # root, so that lookup returned nil and the terminal screen rendered a
      # black void. `type: folder` makes it a folder reference, copied whole.
      - path: MantaUI
        excludes:
          - "Resources/terminal"
          - "GoogleService-Info.plist"
      - path: MantaUI/Resources/terminal
        type: folder
      # Excluded from the directory entry above and re-added explicitly so its
      # build phase is stated rather than inferred: xcodegen's file-type
      # guessing for a .plist is the same machinery that special-cases
      # Info.plist, and this file MUST land in Copy Bundle Resources or
      # FirebaseApp.configure() finds no options and traps at launch.
      - path: MantaUI/GoogleService-Info.plist
        buildPhase: resources
      # The design tokens are GENERATED (scripts/gen-swift-tokens.mjs reads
      # src/renderer/tokens.css). Referenced by path from the app target so the
      # Swift source of truth stays the generated file — never copied or
      # re-typed into this module.
      - path: ../../generated/swift/Theme.swift
      # The settings schema is GENERATED (scripts/gen-swift-settings.mjs reads
      # src/shared/settingsSchema.ts). Same policy: referenced by path, never
      # copied or hand-edited.
      - path: ../../generated/swift/SettingsSchema.swift
    dependencies:
      # Crashlytics only — NOT FirebaseAnalytics. Analytics is optional for
      # Crashlytics and buys breadcrumb logs; it costs an analytics/tracking
      # surface this app has no other use for, and the Firebase project has
      # IS_ANALYTICS_ENABLED false. Add it deliberately if breadcrumbs are
      # wanted, not by reflex.
      - package: Firebase
        product: FirebaseCrashlytics
      - package: MessagingUI
        product: MessagingUI
      - package: MarkdownView
        product: MarkdownView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinedc.mantaui
        PRODUCT_NAME: MantaUI
        GENERATE_INFOPLIST_FILE: YES
        # S8 (BET-600): base Info.plist merged over the generated one — carries
        # the `manta://` custom URL scheme so a pairing link opens the app.
        INFOPLIST_FILE: MantaUI/Info.plist
        # S8 (BET-600): push capability (aps-environment) + Associated Domains
        # for the pairing universal link (applinks:app.mantaui.com).
        CODE_SIGN_ENTITLEMENTS: MantaUI/MantaUI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MantaUI
        INFOPLIST_KEY_NSMicrophoneUsageDescription: MantaUI uses the microphone for push-to-talk dictation and voice commands in chat.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.17"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        # Required by Firebase: its Obj-C categories are stripped by the linker
        # without this, and the symptom is a runtime selector-not-found crash,
        # not a link error.
        OTHER_LDFLAGS: "-ObjC"
        # Crashlytics symbolicates from dSYMs, and Xcode's DEFAULT for Debug is
        # plain `dwarf` — no dSYM is produced at all. The device build this app
        # is installed with (ios-mantaui plugin) is a DEBUG build, so leaving
        # the default would mean every crash from the phone comes back as raw
        # addresses. Set on `base` so it holds for every configuration, which
        # is what Firebase's docs require ("for all your build types").
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    # MUST be the last build phase — Crashlytics cannot process dSYMs otherwise.
    # xcodegen emits postBuildScripts after compile/resources/link, which
    # satisfies that.
    #
    # THIS CALLS `upload-symbols` DIRECTLY RATHER THAN THE `run` WRAPPER, AND
    # THAT IS DELIBERATE. Firebase documents `Crashlytics/run`, and it was used
    # here first — the phase executed, the build went green, and NOTHING was
    # ever uploaded: Crashlytics reported "2 unprocessed crashes, upload 1 dSYM
    # file" while the build log carried no upload line at all. `run` backgrounds
    # its work, so a failure inside it neither prints nor fails the build. The
    # identical `upload-symbols` invocation below, run by hand against the same
    # dSYM, submitted both UUIDs immediately. Prefer the thing that is
    # observable over the thing that is documented.
    #
    # THE TWO-UUID PROBLEM. Xcode 16+ sets ENABLE_DEBUG_DYLIB=YES for Debug, so
    # the binary is SPLIT: the real code lands in <name>.debug.dylib and the
    # main executable is a stub. The dSYM bundle then carries TWO arm64 slices
    # with different UUIDs, and a crash references the debug.dylib's. Passing
    # the .dSYM BUNDLE (not a single DWARF file) makes upload-symbols walk both,
    # which is what finally produced:
    #   Successfully submitted symbols … e0d95707… MantaUI.debug.dylib
    #   Successfully submitted symbols … f496a5ff… MantaUI
    # Release builds are not split and yield one slice; the same command covers
    # both, so there is no per-configuration branch here.
    #
    # NON-FATAL on purpose: a symbol upload needs the network, and a flaky
    # connection must not fail an otherwise good build. It is loud in the log
    # instead — grep "Crashlytics" in the build log to audit it.
    postBuildScripts:
      - name: Crashlytics dSYM upload
        script: |
          UPLOAD="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          DSYM="${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          GSP="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [ ! -x "$UPLOAD" ]; then
            echo "warning: Crashlytics upload-symbols not found at $UPLOAD — crashes will not symbolicate"
          elif [ ! -d "$DSYM" ]; then
            echo "warning: Crashlytics found no dSYM at $DSYM (is DEBUG_INFORMATION_FORMAT dwarf-with-dsym?)"
          elif [ ! -f "$GSP" ]; then
            echo "warning: Crashlytics found no GoogleService-Info.plist at $GSP"
          else
            echo "Crashlytics: uploading $DSYM"
            "$UPLOAD" -gsp "$GSP" -p ios "$DSYM" || echo "warning: Crashlytics symbol upload failed (non-fatal)"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          # The split-binary slice. Absent in Release, which is fine — Xcode
          # treats a missing input as "out of date", so the phase still runs.
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}.debug.dylib
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
  # S1a: the unit-test target. Hosted off the app target so the transport core
  # (models, RPC client, Keychain store) is reachable via @testable import.
  MantaUITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MantaUITests
    dependencies:
      - target: MantaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinedc.mantaui.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  # The UI test bundle is the hierarchy-dump leg of the native capture harness.
  # It launches the app and prints the accessibility tree (see capture.sh and
  # MantaUIHierarchyCaptureUITests). It exists to be driven by capture.sh, not
  # by hand in Xcode.
  MantaUIUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MantaUIUITests
    dependencies:
      - target: MantaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinedc.mantaui.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MantaUI
        CODE_SIGN_STYLE: Automatic
schemes:
  MantaUI:
    build:
      targets:
        MantaUI: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - MantaUITests
        - MantaUIUITests
