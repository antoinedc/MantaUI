<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Manta UI</title>
    <!-- font-src allows data: because Vite INLINES any bundled asset under
         `build.assetsInlineLimit` (4 KB) as a base64 data URL. Two
         JetBrains Mono subsets (cyrillic-ext, normal + italic) fall under
         that threshold, so they ship as `data:font/woff2;base64,…` inside
         the CSS and were refused under the `default-src 'self'` fallback.
         Still no remote origin — data: here is our own bundled bytes. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: http: https:;" />
    <!-- iOS PWA: installable via Safari "Add to Home Screen". Inert on
         desktop Electron (apple-* ignored; manifest link harmlessly 404s
         since Electron loads its own out-dir index.html). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Manta" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  </head>
  <body class="bg-bg text-text font-sans">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
