# Server tarball deploy — build ALL arch tarballs (x64 + arm64 + darwin-arm64)
# and publish them + a combined multi-arch manifest on a `server-v*` git tag,
# or to a `/staging/releases/` subtree on demand.
#
# WHY THIS EXISTS
# ---------------
# The Linux box server tarball is the artifact install.sh downloads. Until
# BET-263 it was x64-only (the tarball filename encoded the arch; the manifest
# only carried the x64 sha). Stage 1 (BET-263) made the build/install scripts
# arch-parameterized. This workflow is the matching CI side: builds the arm64
# tarball natively (no QEMU, no cross-compile — node-pty's native binding
# cannot be cross-compiled), then publishes BOTH tarballs + the combined
# manifest in a single deploy. BET-275 adds darwin-arm64 (Apple Silicon) as
# a third arch for the macOS box path; the darwin build runs on a macos-14
# runner (native Mach-O binding for node-pty).
#
# WHAT IT DEPLOYS
#   dist/manta-<v>-linux-x64.tar.gz     → <RELEASES_DIR>/
#   dist/manta-<v>-linux-arm64.tar.gz   → <RELEASES_DIR>/
#   dist/manta-<v>-darwin-arm64.tar.gz  → <RELEASES_DIR>/
#   dist/manta-<v>.txt                  → <RELEASES_DIR>/
#   (then cp manta-<v>.txt → manta-latest.txt  for prod,
#    or   cp manta-<v>.txt → manta-staging-latest.txt for staging — atomicity)
#
# BUILD HOST CHOICE
#   GitHub-hosted ubuntu-latest (x64) + ubuntu-24.04-arm (linux-arm64) +
#   macos-14 (darwin-arm64) runners, one pack.mjs invocation per arch.
#   node-pty's prebuilt .node binding compiles natively for its runner's ABI
#   — no QEMU, no cross-compile (BET-262 design constraint; the darwin Node
#   is macOS-only and the node-pty binding MUST be a Mach-O arm64 binary).
#   All runners are GitHub-hosted, so no self-hosted runner capacity is
#   burned on the slow arm64 build.
#
# PUBLISH HOST + AUTH
#   Self-hosted runner (same as website-deploy.yml + gateway-deploy.yml) —
#   reaches prod over SSH with the deploy key at ~/.manta-deploy/prod_key. No
#   GitHub secret needed. Reuses website-deploy.yml's scp/ssh invocation
#   verbatim.
#
# ATOMICITY
#   tarballs + versioned manifest are uploaded FIRST; the channel's *-latest.txt
#   pointer (manta-latest.txt for prod, manta-staging-latest.txt for staging)
#   is copied LAST. A client therefore either sees the OLD pointer (and the
#   OLD tarballs are still served) OR the NEW pointer (and the NEW tarballs are
#   already uploaded). Drift between manifest and tarballs is impossible.
#   (Same rule publish.sh documents — generalized to both arches via a loop.)
#   Staging refreshes its OWN pointer only — it must NEVER overwrite the prod
#   manta-latest.txt.
#
# VERIFY
#   After publish, fail red on:
#     - any tarball URL returning non-200
#     - served *-latest.txt's version != the version we just published
#     - any arch's served tarball sha256 != the manifest's sha256_<archkey>
#   This is the two-arch generalization of publish.sh's existing drift check.
#
# TRIGGER: push a tag matching server-v* (e.g. server-v1) → ALWAYS resolves to
#   prod. Also runnable manually via workflow_dispatch with the `channel`
#   input (default staging, since a manual run is nearly always staging).

name: Server tarball deploy

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Deploy channel. prod = /var/www/mantaui/releases (the live tarballs). staging = /var/www/mantaui/staging/releases (on-demand QA channel; never auto-fires)."
        type: choice
        required: true
        default: staging
        options:
          - prod
          - staging

# Serialize: two quick tags must not race two deploys that overwrite each
# other's manifests / tarballs. Same group shape as build-mobile-bundle.yml +
# gateway-deploy.yml.
concurrency:
  group: server-tarball-deploy
  cancel-in-progress: false

env:
  PROD_HOST: root@91.107.196.2
  SSH_KEY: /home/dev/.manta-deploy/prod_key

jobs:
  # Resolve channel ONCE at the entrypoint. Downstream steps read the resolved
  # outputs and never re-derive — same shape as website-deploy.yml.
  resolve:
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      releases_dir: ${{ steps.resolve.outputs.releases_dir }}
      site: ${{ steps.resolve.outputs.site }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            channel="prod"
          else
            channel="${INPUT_CHANNEL:-staging}"
          fi
          if [ "$channel" = "staging" ]; then
            releases_dir="/var/www/mantaui/staging/releases"
            site="https://mantaui.com/staging"
          else
            releases_dir="/var/www/mantaui/releases"
            site="https://mantaui.com"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "releases_dir=$releases_dir" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "▸ Resolved channel=$channel releases_dir=$releases_dir site=$site"

      # HARD GUARD: a staging run that silently writes to the prod releases
      # directory is the only truly dangerous failure mode here, and it must
      # be impossible rather than unlikely. Same guard shape as
      # website-deploy.yml + mac-desktop.
      - name: Guard — staging destination must contain /staging/
        env:
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          RELEASES_DIR: ${{ steps.resolve.outputs.releases_dir }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "staging" ] && [[ "$RELEASES_DIR" != */staging* ]]; then
            echo "::error::channel=staging but RELEASES_DIR='$RELEASES_DIR' does not contain /staging/"
            exit 1
          fi
          echo "✓ guard passed (channel=$CHANNEL, RELEASES_DIR=$RELEASES_DIR)"

  build:
    name: pack (${{ matrix.arch }})
    # One job per arch — node-pty's native binding cannot be cross-compiled,
    # so each arch needs its own runner's ABI. darwin-arm64 must run on a
    # macOS runner (Mach-O binding + macOS-only Node tarball).
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64, darwin-arm64]
    runs-on: >-
      ${{ matrix.arch == 'darwin-arm64' && 'macos-14'
          || matrix.arch == 'arm64' && 'ubuntu-24.04-arm'
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # System node only RUNS pack.mjs; pack downloads its own vendored node
      # internally. We just need a recent enough node for the script.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # devDeps are needed by pack.mjs's `npm run build:mobile` step (vite
      # builds the mobile/www bundle that gets embedded in the tarball).
      - run: npm ci

      - name: pack ${{ matrix.arch }}
        run: node scripts/release/pack.mjs --arch ${{ matrix.arch }}

      - name: Upload tarball + manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-tarball-${{ matrix.arch }}
          # Each per-job artifact name (`server-tarball-<arch>`) isolates this
          # job's upload — `linux-arm64` and `darwin-arm64` tarballs would both
          # collide on `*-arm64.tar.gz`, but only this job's files exist in
          # its `dist/`. Match the full tarball basename so the darwin-arm64
          # filename (no `linux-` prefix) is captured.
          path: |
            dist/manta-*.tar.gz
            dist/manta-*.txt
          if-no-files-found: error

  publish:
    name: publish + verify
    needs: [resolve, build]
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Resolve VERSION once (from package.json) so the steps below can
      # reference it via ${{ steps.vars.outputs.version }} instead of
      # duplicating `node -p` in each one.
      - id: vars
        name: Resolve version
        # NOTE: do NOT backslash-escape the inner quotes of the node script.
        # `node -p 'require(\"./package.json\").version'` makes node evaluate a
        # literal backslash-quote, which is a syntax error → stdout is empty →
        # VERSION="" → every downstream path becomes `manta--linux-*` and the
        # merge/upload/verify steps fail (server-v1's first-run failure). Read
        # package.json without any inner double quotes instead.
        run: |
          set -euo pipefail
          version=$(node -e 'process.stdout.write(require("./package.json").version)')
          test -n "$version" || { echo "::error::empty version from package.json"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved version=$version"

      # Pull both per-arch artifacts into one dist/ — merge-manifest reads
      # from the same dir it expects (matches publish.sh's layout).
      - name: Download per-arch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: server-tarball-*
          path: dist
          merge-multiple: true

      - name: Merge per-arch manifests into the combined manifest
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/merge-manifest.mjs \
            "dist/manta-${VERSION}-linux-x64.txt" \
            "dist/manta-${VERSION}-linux-arm64.txt" \
            "dist/manta-${VERSION}-darwin-arm64.txt" \
            --out "dist/manta-${VERSION}.txt"
          echo "✓ combined manifest: dist/manta-${VERSION}.txt"

      # Same scp/ssh plumbing as website-deploy.yml — no new secrets, no new
      # key path. tarballs + versioned manifest first; channel *-latest.txt
      # pointer LAST so a client either sees old (and old tarballs) or new
      # (and new tarballs are already uploaded) — drift is impossible.
      - name: Upload tarballs + combined manifest to channel destination
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          RELEASES_DIR: ${{ needs.resolve.outputs.releases_dir }}
        run: |
          set -euo pipefail
          SSH="ssh -i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          SCP="scp -i $SSH_KEY -o BatchMode=yes -o StrictHostKeyChecking=accept-new"

          $SSH "$PROD_HOST" "mkdir -p $RELEASES_DIR"

          for arch in linux-x64 linux-arm64 darwin-arm64; do
            tarball="dist/manta-${VERSION}-${arch}.tar.gz"
            echo "▸ Uploading ${tarball}"
            $SCP "$tarball" "$PROD_HOST:$RELEASES_DIR/"
          done
          manifest="dist/manta-${VERSION}.txt"
          echo "▸ Uploading ${manifest}"
          $SCP "$manifest" "$PROD_HOST:$RELEASES_DIR/"

          # Channel-specific pointer. prod refreshes manta-latest.txt (the
          # canonical install.sh pointer). staging refreshes
          # manta-staging-latest.txt — it MUST NOT touch prod's latest.txt,
          # or every install.sh fetch returns a staging build to a prod user.
          channel="${{ needs.resolve.outputs.channel }}"
          if [ "$channel" = "staging" ]; then
            pointer="manta-staging-latest.txt"
          else
            pointer="manta-latest.txt"
          fi
          echo "▸ Publishing ${pointer} (LAST — atomicity)"
          $SSH "$PROD_HOST" "cd $RELEASES_DIR && cp -f manta-${VERSION}.txt ${pointer}"

      - name: Verify deploy (both arches)
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          SITE: ${{ needs.resolve.outputs.site }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          fail=0

          echo "▸ HEAD each tarball URL → 200"
          for arch in linux-x64 linux-arm64 darwin-arm64; do
            url="$SITE/releases/manta-${VERSION}-${arch}.tar.gz"
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::error::${url} → ${code} (expected 200)"
              fail=1
            else
              echo "✓ ${url} → 200"
            fi
          done

          # Channel-specific *-latest.txt pointer — same atomicity invariant.
          if [ "$CHANNEL" = "staging" ]; then
            pointer="manta-staging-latest.txt"
          else
            pointer="manta-latest.txt"
          fi
          echo "▸ Fetch served ${pointer} and assert version"
          served=$(curl -fsSL "$SITE/releases/${pointer}")
          served_version=$(printf '%s\n' "$served" | grep '^version=' | head -n1 | cut -d= -f2-)
          if [ "$served_version" != "$VERSION" ]; then
            echo "::error::served version='${served_version}' expected='${VERSION}'"
            exit 1
          fi
          echo "✓ served version=${served_version}"

          echo "▸ For each arch: download served tarball, assert sha256 against the manifest"
          for arch in linux-x64 linux-arm64 darwin-arm64; do
            arch_key=$(printf '%s' "$arch" | tr '-' '_')
            served_file=$(printf '%s\n' "$served" | grep "^file_${arch_key}=" | head -n1 | cut -d= -f2-)
            served_sha=$(printf '%s\n' "$served"  | grep "^sha256_${arch_key}=" | head -n1 | cut -d= -f2-)
            if [ -z "$served_file" ] || [ -z "$served_sha" ]; then
              echo "::error::served manifest is missing file_${arch_key} or sha256_${arch_key}"
              fail=1
              continue
            fi
            actual_sha=$(curl -fsSL "$SITE/releases/${served_file}" | sha256sum | cut -d' ' -f1)
            if [ "$actual_sha" != "$served_sha" ]; then
              echo "::error::${arch}: tarball/manifest drift — served sha=${served_sha} actual=${actual_sha}"
              fail=1
            else
              echo "✓ ${arch} (${served_file}) sha256 matches manifest"
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more verifications failed."
            exit 1
          fi
          echo "All verifications passed (x64 + arm64 + darwin-arm64, all sha256s match the served manifest)."
