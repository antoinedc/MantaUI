# CI — the deterministic merge gate, ported from the leasebot/tenanture setup.
#
# Job name `typecheck-test` is THE required check — the single context in
# required-checks.json and in the `main` branch ruleset. This makes the PM
# agent's GATE 2 tamper-proof: the gate runs on fresh, ephemeral GitHub-hosted
# runners (this repo is PUBLIC — minutes are free + unlimited, and the 20-job
# concurrency replaced the single self-hosted runner's queue), independent of
# whatever an implementer agent claims locally. The PM reads `gh pr checks`
# instead of checking out PR branches.
#
# ── COST DISCIPLINE (2026-07-27, mirrors tenanture TEN-618; RETIRED 2026-08-01) ─
# This repo HAD exactly ONE self-hosted runner, so jobs did NOT run in parallel —
# they queued, and every extra job was wall-clock time every other open PR waited
# behind. Before that pass a PR cost 13.2 minutes of exclusive runner time
# across six jobs in three workflow files, four of them repeating the same
# checkout and `npm ci`.
#
# 2026-08-01: the repo moved every job to fresh GitHub-hosted runners (it is
# PUBLIC → free + unlimited minutes, 20 concurrent jobs), so the one-runner
# queue is gone. The three fixes below remain best practice (caching, folding
# detectors into steps, dropping redundant required contexts) — keep them as
# written; only the "adding a job queues every other PR" cost is retired.
#
# Three fixes, all of which keep every detector and every blocking semantic:
#   1. `node_modules` is CACHED on the lockfile hash, so `npm ci` runs only when
#      the lockfile actually moves. This is where most of the time went.
#   2. The advisory duplication report is now a STEP of this job rather than its
#      own workflow (anti-spaghetti.yml is deleted).
#   3. The gitleaks secret scan and the dependency audit are now STEPS of this
#      job too (security-gates.yml is deleted). They were separate only because
#      they were named required contexts in the branch ruleset; those contexts
#      were dropped first, which is the mandatory ordering — a required context
#      that no job produces blocks every PR forever.
#
# (The old corollary — "adding a JOB costs every other open PR wall-clock time,
# so prefer a step" — is retired with the one-runner queue; jobs now run in
# parallel on GitHub-hosted runners. Prefer a step only when it keeps logic
# co-located. Adding a required CONTEXT still means editing GitHub-side ruleset
# config that CI cannot reach — a deliberate speed bump.)
#
# Scope deliberately matches AGENTS.md's documented gate:
#   npm run typecheck && npm test   (tsc x2, vitest, node:test)
# No lint gate — the repo has no eslint config and ChatPanel-scale legacy would
# make one permanently red. Duplication/lint signal is the non-blocking advisory
# report below instead.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # advisory duplication sticky comment (PR events only)
    steps:
      # Full history: gitleaks scans all of it, and the advisory report and the
      # dependency-change check both diff against the merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available (merge-base source)
        run: git fetch --no-tags --depth=1 origin main 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node_modules keyed on the lockfile: `npm ci` only runs when the lockfile
      # changes. Exact key only, no restore-keys — a node_modules built for a
      # different lockfile must never be silently reused.
      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}

      # postinstall is `node scripts/postinstall.mjs` — cross-platform and
      # incapable of failing an install (its only job is a macOS dev-bundle
      # rename). No native rebuild runs here or anywhere: the desktop app
      # imports no native module, so electron-builder.yml sets
      # `npmRebuild: false`. Tests don't spawn ptys either.
      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # ── Pillow — `npm test` shells out to scripts/build-og-image.py, which
      #    imports PIL. The retired self-hosted runner happened to have it
      #    installed; a GitHub-hosted image does not, so the move to
      #    ubuntu-latest turned every run red with `ModuleNotFoundError: No
      #    module named 'PIL'` — on main and on every open PR at once, none of
      #    them for a reason in their own diff. Installed here rather than
      #    skipping the test when PIL is absent: a test that silently skips in
      #    CI is a test that stops running, and og.png determinism is exactly
      #    the kind of generated-artifact drift nobody re-checks by hand.
      #    ~3s on a warm image. scripts/gen-icons.py needs the same import but
      #    no test invokes it today.
      - name: Install Pillow (scripts/*.py image generation)
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest + node:test)
        run: npm test

      # ── Swift token drift gate — keep `generated/swift/Theme.swift`
      #    byte-identical to what `scripts/gen-swift-tokens.mjs` regenerates
      #    from `src/renderer/tokens.css` (BET-516). `tokens.css` is the
      #    single source of truth for design tokens; a committed Swift file
      #    that drifts from it is a silent divergence. This is a STEP in the
      #    required `typecheck-test` job (not a new job) so a drift fails the
      #    PR — same shape as the `website/shot-*.webp` gate below.
      #    `--check` regenerates in memory, writes nothing, and exits non-zero
      #    on mismatch; the script prints the remedy (run `npm run
      #    gen:swift-tokens` and commit). Deliberately unconditional: no path
      #    filter, so a hand-edit of the generated file is also caught.
      - name: Swift token drift gate — regenerate and diff against committed generated/swift/Theme.swift
        run: npm run gen:swift-tokens -- --check

      # ── Swift settings-schema drift gate (BET-599) — keep
      #    `generated/swift/SettingsSchema.swift` byte-identical to what
      #    `scripts/gen-swift-settings.mjs` regenerates from
      #    `src/shared/settingsSchema.ts` (the single source of truth for the
      #    settings inventory). Same shape as the tokens gate above: a
      #    device settings list that drifts from the schema is a silent
      #    divergence, and adding a setting to the schema must surface it on
      #    iOS without a hand-edited Swift list.
      - name: Swift settings-schema drift gate — regenerate and diff against committed generated/swift/SettingsSchema.swift
        run: npm run gen:swift-settings -- --check


      # ── REMOVED (BET-602): the two Playwright screenshot gates that used to
      #    run here — the `website/shot-*.webp` drift gate and the app-screen
      #    visual gate (`npm run visual`). Do not re-add either to this job
      #    without reading this first; both were deliberate removals, not an
      #    oversight.
      #
      #    WHY. A pixel gate whose baselines are captured FROM the app detects
      #    CHANGE, not CORRECTNESS: whatever ships becomes the definition of
      #    correct on the next `--update-snapshots`. That is not theoretical
      #    here. Three of this repo's own artifacts prove it:
      #
      #      - The welcome screen shipped with three surfaces that had NO
      #        background at all (`bg-card` names a colour key that does not
      #        exist, so it compiled to nothing — BET-583). The gate was green
      #        throughout, because the baselines had been recorded from the
      #        broken render.
      #      - `docs/screens/welcome/conformance.md` read "no divergences",
      #        reviewed the same day that screen was visibly wrong.
      #      - `tests/visual/shadow.visual.ts`'s own header records that
      #        BET-563's shadow-scale retune moved 0/20 baselines: the gate was
      #        structurally blind to an entire token class, which is why a
      #        separate shadow-only capture had to be hand-built.
      #
      #    The failure mode is worse with agents doing the work. Every issue
      #    instructed the implementer to "regenerate the baselines", which means
      #    accepting whatever was just rendered — so the gate laundered defects
      #    into committed expectations and then reported green.
      #
      #    COST. 58 of the 1358 commits between 2026-06-01 and 2026-08-02 were
      #    baseline or gate upkeep (~1 in 23); 82 touched snapshot files. Three
      #    separate issues existed only to repair the gate itself (BET-537
      #    non-deterministic capture on CI, BET-543 permanently-failing diff
      #    artifact, BET-542 re-enabling exempted shots). It sat in the ONE
      #    required job, so each flake blocked every open PR.
      #
      #    WHAT REPLACES THEM. Nothing, for the app screens — the correctness
      #    tool is `npm run visual:compare <screen>`, which diffs the app
      #    against the MOCKUP rather than against itself, and is advisory + run
      #    on demand. For the marketing shots, nothing is lost: the identical
      #    check already runs nightly on main in dep-audit-nightly.yml ("Shot
      #    drift on main"), which catches a stale committed set without
      #    blocking a PR.
      #
      #    STILL AVAILABLE LOCALLY. `npm run visual`, `npm run visual:update`,
      #    `npm run visual:compare`, `npm run shots` and every baseline under
      #    tests/visual/ are untouched and runnable. Only the CI enforcement is
      #    gone. Removing the two steps also let ffmpeg + the pinned-Chromium
      #    install drop out of this job (both are still installed by the E2E
      #    job and dep-audit-nightly, so the composite actions stay).
      #
      #    Because both were STEPS in `typecheck-test` and not jobs of their
      #    own, no required-context changed: required-checks.json and the `main`
      #    ruleset are untouched.

      # ── Security gates (moved verbatim from security-gates.yml, now deleted.
      #    Same detectors, same blocking behaviour, no extra runner slot) ────
      #
      # gitleaks over the full history. The allowlist in .gitleaks.toml covers
      # ONLY the built bundle outputs (verified false positives); real
      # source is fully scanned. THE reason this repo needs it: agents write
      # most commits now, and an agent pasting a live token into code or docs
      # must fail deterministically, not depend on reviewer attention.
      #
      # Version-pinned into a per-version cache path, so the binary downloads
      # once per runner rather than on every run, and a gitleaks release can
      # never silently change the gate's behaviour.
      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.24.3
          BIN="$HOME/.cache/gitleaks/${GITLEAKS_VERSION}/gitleaks"
          if [ ! -x "$BIN" ]; then
            mkdir -p "$(dirname "$BIN")"
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar xz -C "$(dirname "$BIN")"
          fi
          "$BIN" detect --source . --config .gitleaks.toml --log-level=warn \
            --exit-code 1 --report-format json --report-path gitleaks-report.json \
            || { cat gitleaks-report.json; exit 1; }

      # npm audit scoped to PRODUCTION deps at high+: dev toolchain advisories
      # (the vite/electron chain) are chronic noise with breaking-change fixes;
      # shipped-code advisories are the signal.
      #
      # An audit's result depends ONLY on the dependency set, not on this PR's
      # code. Auditing a PR that doesn't touch package*.json re-measures main,
      # which means the day a new upstream advisory lands EVERY open PR goes red
      # at once through no fault of its own — with a backlog in flight that is a
      # mass-block event. tenanture hit it five times (TEN-574/585/588/589/606)
      # before splitting it this way. dep-audit-nightly.yml covers main daily,
      # so an advisory surfaces as one red run and one fix issue instead.
      - name: Dependency audit (only when the PR changes the dependency set)
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only "$(git merge-base origin/main HEAD)" HEAD -- package.json package-lock.json | grep -q .; then
            npm audit --omit=dev --audit-level=high
          else
            echo "package.json / package-lock.json unchanged vs merge-base — the audit would be identical to main's. Skipping (dep-audit-nightly.yml covers main)."
          fi

      # ── Advisory duplication report (moved verbatim from anti-spaghetti.yml,
      #    now deleted). NON-BLOCKING by design and deliberately NOT a required
      #    check: jscpd on a diff is noisy (coincidental clones, the intentional
      #    desktop/mobile transport mirrors), so a hard gate would block nearly
      #    every PR. The signal is computed once and posted as a sticky PR
      #    comment; the manta-reviewer agent READS it and exercises judgment.
      #    CI never decides. Detector logic lives in scripts/check-duplication.sh
      #    so the reviewer can run the identical script when the comment is
      #    missing. The blocking half is the separate duplication-gate job. ──
      - name: Duplication report (advisory)
        if: github.event_name == 'pull_request'
        run: |
          # Never fail the job on detector output — this is a signal, not a gate.
          bash scripts/check-duplication.sh "origin/${{ github.base_ref }}" \
            > /tmp/anti-spaghetti-report.md 2>&1 || true
          echo "Report written ($(wc -l < /tmp/anti-spaghetti-report.md) lines)."

      - name: Post / update duplication sticky comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/anti-spaghetti-report.md', 'utf8');
            const marker = '<!-- anti-spaghetti-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  # STRICT duplication gate — the blocking half of the anti-spaghetti
  # discipline. Deliberately NOT a required check (de-required 2026-07-02:
  # flaky at token boundaries, it blocked BET-57/PR#27, and agents cannot rerun
  # CI). It still runs and still goes red, which is the signal the PM and
  # reviewer read.
  #
  # It restores the same node_modules cache as the job above, so `npx jscpd`
  # resolves the version pinned in package.json instead of fetching the latest
  # from npm on every run — faster, and it closes the local-vs-CI version drift
  # that BET-220 flagged.
  duplication-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}
      - name: Strict duplication gate
        run: bash scripts/check-duplication-gate.sh "origin/${{ github.base_ref }}"
