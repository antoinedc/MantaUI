# CI — the deterministic merge gate, ported from the leasebot/tenanture setup.
#
# Job name `typecheck-test` is THE required check — the single context in
# required-checks.json and in the `main` branch ruleset. This makes the PM
# agent's GATE 2 tamper-proof: the gate runs on the repo's self-hosted runner
# (manta-dev-runner on the dev box), independent of whatever an implementer
# agent claims locally. The PM reads `gh pr checks` instead of checking out PR
# branches.
#
# ── COST DISCIPLINE (2026-07-27, mirrors tenanture TEN-618) ──────────────────
# This repo has exactly ONE self-hosted runner, so jobs do NOT run in parallel —
# they queue, and every extra job is wall-clock time every other open PR waits
# behind. Before this pass a PR cost 13.2 minutes of exclusive runner time
# across six jobs in three workflow files, four of them repeating the same
# checkout and `npm ci`.
#
# Three fixes, all of which keep every detector and every blocking semantic:
#   1. `node_modules` is CACHED on the lockfile hash, so `npm ci` runs only when
#      the lockfile actually moves. This is where most of the time went.
#   2. The advisory duplication report is now a STEP of this job rather than its
#      own workflow (anti-spaghetti.yml is deleted).
#   3. The gitleaks secret scan and the dependency audit are now STEPS of this
#      job too (security-gates.yml is deleted). They were separate only because
#      they were named required contexts in the branch ruleset; those contexts
#      were dropped first, which is the mandatory ordering — a required context
#      that no job produces blocks every PR forever.
#
# The corollary: adding a JOB now costs every other open PR wall-clock time, so
# prefer a step. Adding a required CONTEXT means editing GitHub-side ruleset
# config that CI cannot reach — a deliberate speed bump.
#
# Scope deliberately matches AGENTS.md's documented gate:
#   npm run typecheck && npm test   (tsc x2, vitest, node:test)
# No lint gate — the repo has no eslint config and ChatPanel-scale legacy would
# make one permanently red. Duplication/lint signal is the non-blocking advisory
# report below instead.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # advisory duplication sticky comment (PR events only)
    steps:
      # Full history: gitleaks scans all of it, and the advisory report and the
      # dependency-change check both diff against the merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available (merge-base source)
        run: git fetch --no-tags --depth=1 origin main 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node_modules keyed on the lockfile: `npm ci` only runs when the lockfile
      # changes. Exact key only, no restore-keys — a node_modules built for a
      # different lockfile must never be silently reused.
      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}

      # postinstall is `node scripts/postinstall.mjs` — cross-platform and
      # incapable of failing an install (its only job is a macOS dev-bundle
      # rename). No native rebuild runs here or anywhere: the desktop app
      # imports no native module, so electron-builder.yml sets
      # `npmRebuild: false`. Tests don't spawn ptys either.
      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest + node:test)
        run: npm test

      # ── Drift gate — keep `website/shot-*.webp` byte-identical to what
      #    the live renderer paints today. BET-341 (follow-up from BET-303
      #    review Nit #1) — when origin/main's renderer changes between
      #    branch cut and merge, the committed shots go silently stale; this
      #    catches it at PR time instead of post-merge.
      #
      #    Added as a STEP (not a new job) per the cost discipline at the top
      #    of this file — one self-hosted runner, one queue slot. `typecheck-
      #    test` IS the required check (required-checks.json + the main
      #    ruleset), so a failed diff here blocks the PR, which is exactly
      #    what BET-341 asked for. No new required-context, no ruleset edit.
      #
      #    Cost: `npm run shots` builds the renderer (~10s), captures 6 shots
      #    (~10-15s) and composites shot-sync (~2s) — ~25-30s per PR. The
      #    node_modules cache above is reused; only the capture cost is new.
      #
      #    PR-only on purpose: a push to main has already cleared this gate
      #    when the PR was merged, so re-running here would just measure
      #    main against itself. PR is the only event where a stale set can
      #    slip in.
      #
      #    This is BLOCKING again (BET-444). It was temporarily advisory
      #    because Chrome 148 refused every loopback navigation (the captures
      #    could not run at all) and then, after moving to Playwright's pinned
      #    Chromium, two consecutive captures of the same UI were not
      #    byte-identical. Both are fixed: shots.mjs now uses the shared
      #    LAUNCH_OPTIONS (bundled Chromium pinned by package-lock.json), and
      #    the two-run below asserts determinism. The first `npm run shots`
      #    rebuilds + captures; the second proves run-to-run byte-identity; the
      #    final git diff guards both against the committed set. A determinism
      #    regression fails HERE (as itself), not as a mystery diff on some
      #    unrelated PR.
      #
      #    The pinned Chromium must be present BEFORE the drift gate captures.
      #    After the 2026-07-31 Chrome-148 failure the gate ran cold against
      #    whatever browser was already in the runner cache — the visual gate's
      #    browser install step sat AFTER this step — so a stale cache could
      #    launch a browser that paints differently from the committed set.
      #    The lockfile-pinned browser is installed here, first, so both this
      #    gate and the visual gate below drive the exact renderer the
      #    baselines were encoded under.
      - name: Cache Playwright browsers
        id: pw-cache-drift
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install ${{ steps.pw-cache-drift.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}

      - name: Drift gate — regenerate website/shot-*.webp and diff against the committed set
        if: github.event_name == 'pull_request'
        run: |
          npm run shots
          npm run shots
          # Scope is the SHOT ARTIFACTS this gate owns (website/shot-*.webp +
          # hero-poster.webp). NOT the whole website/ dir — the npm test step
          # regenerates website/sitemap.xml from git history, so including it
          # here makes the gate measure the sitemap's lastmod against a stale
          # committed copy and fail on an unrelated file (BET-444).
          echo "::group::Post-capture shot diff against the committed set"
          git status --porcelain -- website/shot-*.webp website/hero-poster.webp || true
          git diff --name-status -- website/shot-*.webp website/hero-poster.webp || true
          git diff --stat -- website/shot-*.webp website/hero-poster.webp || true
          echo "::endgroup::"
          if ! git diff --exit-code --quiet -- website/shot-*.webp website/hero-poster.webp; then
            echo "::error file=website/shot-*.webp::drift detected — two consecutive runs differ from the committed set. Either the renderer changed or the capture is not byte-deterministic."
            echo "::error::If the renderer intentionally changed, run 'npm run shots' locally and commit the regenerated files. If not, the capture pipeline is non-deterministic — investigate before merging."
            exit 1
          fi

      # ── Visual gate — every screen in scripts/visual/screens.mjs is checked
      #    for structure (accessibility-tree snapshot) and pixels (screenshot
      #    vs committed baseline). See docs/visual-verification.md.
      #
      #    Why this is a STEP in the required job, not a new job: one
      #    self-hosted runner, one queue slot (cost discipline at the top of
      #    this file). It is deterministic by construction — fixture-backed
      #    demo transport, no network, animations disabled, selector-gated
      #    waits, and Playwright's version-pinned Chromium (NOT system Chrome,
      #    which auto-updates and would silently invalidate every baseline).
      #    So it blocks, like the other gates here.
      #
      #    Cost: builds the renderer (~13s) + ~3s per screen. The browser is
      #    restored from the same Playwright cache the E2E job uses.
      #
      #    Baselines are regenerated deliberately with `npm run visual:update`
      #    and reviewed as part of the diff — never auto-updated in CI, which
      #    would make the gate unfalsifiable.
      #
      #    The pinned Chromium was installed above (before the drift gate), so
      #    the visual gate reuses it from the shared cache.
      - name: Visual gate (structure + pixel baselines)
        run: npm run visual

      # ── Security gates (moved verbatim from security-gates.yml, now deleted.
      #    Same detectors, same blocking behaviour, no extra runner slot) ────
      #
      # gitleaks over the full history. The allowlist in .gitleaks.toml covers
      # ONLY the built mobile/www bundles (verified false positives); real
      # source is fully scanned. THE reason this repo needs it: agents write
      # most commits now, and an agent pasting a live token into code or docs
      # must fail deterministically, not depend on reviewer attention.
      #
      # Version-pinned into a per-version cache path, so the binary downloads
      # once per runner rather than on every run, and a gitleaks release can
      # never silently change the gate's behaviour.
      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.24.3
          BIN="$HOME/.cache/gitleaks/${GITLEAKS_VERSION}/gitleaks"
          if [ ! -x "$BIN" ]; then
            mkdir -p "$(dirname "$BIN")"
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar xz -C "$(dirname "$BIN")"
          fi
          "$BIN" detect --source . --config .gitleaks.toml --log-level=warn \
            --exit-code 1 --report-format json --report-path gitleaks-report.json \
            || { cat gitleaks-report.json; exit 1; }

      # npm audit scoped to PRODUCTION deps at high+: dev toolchain advisories
      # (the vite/electron chain) are chronic noise with breaking-change fixes;
      # shipped-code advisories are the signal.
      #
      # An audit's result depends ONLY on the dependency set, not on this PR's
      # code. Auditing a PR that doesn't touch package*.json re-measures main,
      # which means the day a new upstream advisory lands EVERY open PR goes red
      # at once through no fault of its own — with a backlog in flight that is a
      # mass-block event. tenanture hit it five times (TEN-574/585/588/589/606)
      # before splitting it this way. dep-audit-nightly.yml covers main daily,
      # so an advisory surfaces as one red run and one fix issue instead.
      - name: Dependency audit (only when the PR changes the dependency set)
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only "$(git merge-base origin/main HEAD)" HEAD -- package.json package-lock.json | grep -q .; then
            npm audit --omit=dev --audit-level=high
          else
            echo "package.json / package-lock.json unchanged vs merge-base — the audit would be identical to main's. Skipping (dep-audit-nightly.yml covers main)."
          fi

      # ── Advisory duplication report (moved verbatim from anti-spaghetti.yml,
      #    now deleted). NON-BLOCKING by design and deliberately NOT a required
      #    check: jscpd on a diff is noisy (coincidental clones, the intentional
      #    desktop/mobile transport mirrors), so a hard gate would block nearly
      #    every PR. The signal is computed once and posted as a sticky PR
      #    comment; the manta-reviewer agent READS it and exercises judgment.
      #    CI never decides. Detector logic lives in scripts/check-duplication.sh
      #    so the reviewer can run the identical script when the comment is
      #    missing. The blocking half is the separate duplication-gate job. ──
      - name: Duplication report (advisory)
        if: github.event_name == 'pull_request'
        run: |
          # Never fail the job on detector output — this is a signal, not a gate.
          bash scripts/check-duplication.sh "origin/${{ github.base_ref }}" \
            > /tmp/anti-spaghetti-report.md 2>&1 || true
          echo "Report written ($(wc -l < /tmp/anti-spaghetti-report.md) lines)."

      - name: Post / update duplication sticky comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/anti-spaghetti-report.md', 'utf8');
            const marker = '<!-- anti-spaghetti-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  # STRICT duplication gate — the blocking half of the anti-spaghetti
  # discipline. Deliberately NOT a required check (de-required 2026-07-02:
  # flaky at token boundaries, it blocked BET-57/PR#27, and agents cannot rerun
  # CI). It still runs and still goes red, which is the signal the PM and
  # reviewer read.
  #
  # It restores the same node_modules cache as the job above, so `npx jscpd`
  # resolves the version pinned in package.json instead of fetching the latest
  # from npm on every run — faster, and it closes the local-vs-CI version drift
  # that BET-220 flagged.
  duplication-gate:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}
      - name: Strict duplication gate
        run: bash scripts/check-duplication-gate.sh "origin/${{ github.base_ref }}"

  # The BET-9 e2e smoke gate. NOT in required-checks.json (Electron+Xvfb on the
  # runner is flakier than the deterministic gates); the PM treats a red
  # e2e-smoke as a judgment call, a red typecheck-test as an absolute stop.
  e2e-smoke:
    name: E2E Smoke Test
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Playwright's browser download is the slowest part of this job and only
      # changes when the Playwright version does. `--with-deps` needs sudo apt
      # and is only required the first time on a given runner.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install ${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}

      - name: Run E2E smoke tests
        run: bash scripts/check-e2e-smoke.sh
