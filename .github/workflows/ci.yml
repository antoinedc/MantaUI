# CI — the deterministic merge gate, ported from the leasebot/tenanture setup.
#
# Job name `typecheck-test` is THE required check — the single context in
# required-checks.json and in the `main` branch ruleset. This makes the PM
# agent's GATE 2 tamper-proof: the gate runs on fresh, ephemeral GitHub-hosted
# runners (this repo is PUBLIC — minutes are free + unlimited, and the 20-job
# concurrency replaced the single self-hosted runner's queue), independent of
# whatever an implementer agent claims locally. The PM reads `gh pr checks`
# instead of checking out PR branches.
#
# ── COST DISCIPLINE (2026-07-27, mirrors tenanture TEN-618; RETIRED 2026-08-01) ─
# This repo HAD exactly ONE self-hosted runner, so jobs did NOT run in parallel —
# they queued, and every extra job was wall-clock time every other open PR waited
# behind. Before that pass a PR cost 13.2 minutes of exclusive runner time
# across six jobs in three workflow files, four of them repeating the same
# checkout and `npm ci`.
#
# 2026-08-01: the repo moved every job to fresh GitHub-hosted runners (it is
# PUBLIC → free + unlimited minutes, 20 concurrent jobs), so the one-runner
# queue is gone. The three fixes below remain best practice (caching, folding
# detectors into steps, dropping redundant required contexts) — keep them as
# written; only the "adding a job queues every other PR" cost is retired.
#
# Three fixes, all of which keep every detector and every blocking semantic:
#   1. `node_modules` is CACHED on the lockfile hash, so `npm ci` runs only when
#      the lockfile actually moves. This is where most of the time went.
#   2. The advisory duplication report is now a STEP of this job rather than its
#      own workflow (anti-spaghetti.yml is deleted).
#   3. The gitleaks secret scan and the dependency audit are now STEPS of this
#      job too (security-gates.yml is deleted). They were separate only because
#      they were named required contexts in the branch ruleset; those contexts
#      were dropped first, which is the mandatory ordering — a required context
#      that no job produces blocks every PR forever.
#
# (The old corollary — "adding a JOB costs every other open PR wall-clock time,
# so prefer a step" — is retired with the one-runner queue; jobs now run in
# parallel on GitHub-hosted runners. Prefer a step only when it keeps logic
# co-located. Adding a required CONTEXT still means editing GitHub-side ruleset
# config that CI cannot reach — a deliberate speed bump.)
#
# Scope deliberately matches AGENTS.md's documented gate:
#   npm run typecheck && npm test   (tsc x2, vitest, node:test)
# No lint gate — the repo has no eslint config and ChatPanel-scale legacy would
# make one permanently red. Duplication/lint signal is the non-blocking advisory
# report below instead.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # advisory duplication sticky comment (PR events only)
    steps:
      # Full history: gitleaks scans all of it, and the advisory report and the
      # dependency-change check both diff against the merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available (merge-base source)
        run: git fetch --no-tags --depth=1 origin main 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node_modules keyed on the lockfile: `npm ci` only runs when the lockfile
      # changes. Exact key only, no restore-keys — a node_modules built for a
      # different lockfile must never be silently reused.
      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}

      # postinstall is `node scripts/postinstall.mjs` — cross-platform and
      # incapable of failing an install (its only job is a macOS dev-bundle
      # rename). No native rebuild runs here or anywhere: the desktop app
      # imports no native module, so electron-builder.yml sets
      # `npmRebuild: false`. Tests don't spawn ptys either.
      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # ── Pillow — `npm test` shells out to scripts/build-og-image.py, which
      #    imports PIL. The retired self-hosted runner happened to have it
      #    installed; a GitHub-hosted image does not, so the move to
      #    ubuntu-latest turned every run red with `ModuleNotFoundError: No
      #    module named 'PIL'` — on main and on every open PR at once, none of
      #    them for a reason in their own diff. Installed here rather than
      #    skipping the test when PIL is absent: a test that silently skips in
      #    CI is a test that stops running, and og.png determinism is exactly
      #    the kind of generated-artifact drift nobody re-checks by hand.
      #    ~3s on a warm image. scripts/gen-icons.py needs the same import but
      #    no test invokes it today.
      - name: Install Pillow (scripts/*.py image generation)
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      # ── ffmpeg — the drift gate runs `npm run shots`, which extracts
      #    website/hero-poster.webp from hero.mp4 (scripts/shots.mjs). Same
      #    class of breakage as Pillow above: the self-hosted runner had it,
      #    and GitHub dropped ffmpeg from the ubuntu-24.04 image, so the step
      #    died with "ffmpeg not found at /usr/bin/ffmpeg".
      #    NOTE: shots.mjs hardcodes that absolute path rather than resolving
      #    the binary from PATH. apt installs to /usr/bin so this works, but
      #    the hardcode is still wrong (a Homebrew ffmpeg lands in
      #    /opt/homebrew/bin and would not be found) — tracked separately
      #    (BET-522 does not change shots.mjs). Shared with dep-audit-nightly.
      - uses: ./.github/actions/install-ffmpeg

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest + node:test)
        run: npm test

      # ── Swift token drift gate — keep `generated/swift/Theme.swift`
      #    byte-identical to what `scripts/gen-swift-tokens.mjs` regenerates
      #    from `src/renderer/tokens.css` (BET-516). `tokens.css` is the
      #    single source of truth for design tokens; a committed Swift file
      #    that drifts from it is a silent divergence. This is a STEP in the
      #    required `typecheck-test` job (not a new job) so a drift fails the
      #    PR — same shape as the `website/shot-*.webp` gate below.
      #    `--check` regenerates in memory, writes nothing, and exits non-zero
      #    on mismatch; the script prints the remedy (run `npm run
      #    gen:swift-tokens` and commit). Deliberately unconditional: no path
      #    filter, so a hand-edit of the generated file is also caught.
      - name: Swift token drift gate — regenerate and diff against committed generated/swift/Theme.swift
        run: npm run gen:swift-tokens -- --check

      # ── Drift gate — keep `website/shot-*.webp` byte-identical to what
      #    the live renderer paints today. BET-341 (follow-up from BET-303
      #    review Nit #1) — when origin/main's renderer changes between
      #    branch cut and merge, the committed shots go silently stale; this
      #    catches it at PR time instead of post-merge.
      #
      #    Added as a STEP (not a new job) to keep logic co-located with the
      #    required gate. `typecheck-
      #    test` IS the required check (required-checks.json + the main
      #    ruleset), so a failed diff here blocks the PR, which is exactly
      #    what BET-341 asked for. No new required-context, no ruleset edit.
      #
      #    Cost: `npm run shots` builds the renderer (~10s), captures 6 shots
      #    (~10-15s) and composites shot-sync (~2s) — ~25-30s per PR. The
      #    node_modules cache above is reused; only the capture cost is new.
      #
      #    PR-only on purpose: a push to main has already cleared this gate
      #    when the PR was merged, so re-running here would just measure
      #    main against itself. PR is the only event where a stale set can
      #    slip in.
      #
      #    This is BLOCKING again (BET-444). It was temporarily advisory
      #    because Chrome 148 refused every loopback navigation (the captures
      #    could not run at all) and then, after moving to Playwright's pinned
      #    Chromium, two consecutive captures of the same UI were not
      #    byte-identical. Both are fixed: shots.mjs now uses the shared
      #    LAUNCH_OPTIONS (bundled Chromium pinned by package-lock.json). The gate
      #    captures twice and compares the two runs for byte-identity: the first
      #    `npm run shots` rebuilds + captures into the working tree, and a copy of
      #    its output is stashed in $RUNNER_TEMP; the second runs again into the same
      #    paths. If the two runs differ, the step fails as CAPTURE IS
      #    NON-DETERMINISTIC — the committed set is not the problem. Only when the two
      #    runs are byte-identical does the step diff the result against the committed
      #    set, failing as COMMITTED SHOTS ARE STALE with the remedy to run
      #    `npm run shots` and commit. A determinism regression fails HERE (as
      #    itself), not as a mystery diff on some unrelated PR.
      #
      # The pinned Chromium must be present BEFORE the drift gate captures.
      # After the 2026-07-31 Chrome-148 failure the gate ran cold against
      # whatever browser was already in the runner cache — the visual gate's
      # browser install step sat AFTER this step — so a stale cache could
      # launch a browser that paints differently from the committed set.
      # The lockfile-pinned browser is installed here, first, so both this
      # gate and the visual gate below drive the exact renderer the
      # baselines were encoded under. Shared with the E2E job + dep-audit-nightly.
      - uses: ./.github/actions/cache-playwright-browsers

      - name: Drift gate — regenerate website/shot-*.webp and diff against the committed set
        id: drift_gate
        if: github.event_name == 'pull_request'
        run: |
          # A PR that touches none of the capture inputs cannot make the shots
          # stale, and on a PR that can't affect them a red result would only
          # inherit someone else's staleness. So run the gate only when the PR
          # changes a file that feeds the capture — same mechanism as the
          # conditional dependency audit in this job (diff against the merge
          # base, gate on what the PR actually touched). The five paths are
          # complete and specified by BET-518: the renderer paints the shots,
          # website/ holds them, the two scripts capture them, and the lockfile
          # pins the browser that renders them.
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD -- \
               src/renderer/ website/ scripts/shots.mjs scripts/visual/harness.mjs package-lock.json | grep -q .; then
            # First capture — rebuilds + renders into website/.
            npm run shots
            # Stash this run's output OUTSIDE the working tree ($RUNNER_TEMP) so
            # the second run can't overwrite it and a stray copy can't show up in
            # the git diff below. Scope is exactly the shot artifacts this gate
            # owns (website/shot-*.webp + hero-poster.webp), never the whole
            # website/ dir.
            TMP="$(mktemp -d "$RUNNER_TEMP/shots-drift.XXXXXX")"
            trap 'rm -rf "$TMP"' EXIT
            cp website/shot-*.webp "$TMP"/ 2>/dev/null || true
            [ -f website/hero-poster.webp ] && cp website/hero-poster.webp "$TMP"/
            # Second capture — into the same paths as the first.
            npm run shots
            # Preserve run-2's freshly regenerated bytes to a durable temp dir so
            # the drift-failure step can upload them on a staleness failure.
            mkdir -p "$RUNNER_TEMP/shots-fail-regen"
            cp website/shot-*.webp website/hero-poster.webp "$RUNNER_TEMP/shots-fail-regen"/ 2>/dev/null || true
            # DETERMINISM CHECK — always first. A non-deterministic capture makes
            # the staleness comparison meaningless, so it must be reported as
            # itself before any diff against the committed set. Compare the
            # stashed copy (run 1) to the freshly produced files (run 2) byte for
            # byte; the committed set is not consulted or implicated.
            NON_DET=""
            for f in website/shot-*.webp website/hero-poster.webp; do
              [ -f "$f" ] || continue
              b="$(basename "$f")"
              if [ ! -f "$TMP/$b" ] || ! cmp -s "$TMP/$b" "$f"; then
                NON_DET="$NON_DET $b"
              fi
            done
            if [ -n "$NON_DET" ]; then
              echo "::error file=website/shot-*.webp::CAPTURE IS NON-DETERMINISTIC — two consecutive 'npm run shots' runs differ for:${NON_DET# }. The committed set is not the problem."
              echo "::error::The capture pipeline itself produced different bytes across two identical runs. Investigate the browser/capture before merging; do not regenerate the committed set."
              exit 1
            fi
            # STALENESS CHECK — reached only when the two runs are byte-identical
            # ON THIS RUNNER. That is NOT the same as byte-identical across
            # runners: four of the seven shots render in two variants depending
            # on which runner instance the job lands on (measured 2026-08-02 —
            # the same committed set passed #476/#477/#478 and then failed a
            # branch that differed from main by one CSS comment, with the byte
            # sizes swapped back exactly). A byte comparison is therefore
            # unsatisfiable for those four, which is what produced the BET-517 /
            # BET-537 / BET-542 / BET-575 loop. scripts/shots-compare.mjs keeps
            # exact byte equality for the three stable shots and applies a
            # measured absolute pixel budget to the four variant ones.
            echo "::group::Post-capture shot diff against the committed set"
            git status --porcelain -- website/shot-*.webp website/hero-poster.webp || true
            git diff --name-status -- website/shot-*.webp website/hero-poster.webp || true
            git diff --stat -- website/shot-*.webp website/hero-poster.webp || true
            echo "::endgroup::"
            CMP="$(mktemp -d "$RUNNER_TEMP/shots-compare.XXXXXX")"
            mkdir -p "$CMP/committed" "$CMP/regenerated"
            for f in website/shot-*.webp website/hero-poster.webp; do
              [ -f "$f" ] || continue
              # HEAD is the committed set; the working tree holds run 2's output.
              git show "HEAD:$f" > "$CMP/committed/$(basename "$f")" 2>/dev/null || true
              cp "$f" "$CMP/regenerated/$(basename "$f")"
            done
            node scripts/shots-compare.mjs "$CMP"
          else
            echo "PR touches neither the renderer, website/, the shot-capture scripts, nor the lockfile — the shots this gate owns cannot have gone stale from it. Skipping (main coverage is the shots job in dep-audit-nightly.yml)."
          fi

      # ── Drift-failure evidence (BET-537) — make the failing bytes obtainable.
      #    When the drift gate above fails, nobody can currently see WHAT the
      #    runner rendered differently from the committed set — only `git diff
      #    --stat` (byte sizes, not content) in the log. This step runs on the
      #    drift step's failure and uploads BOTH byte sets (the freshly
      #    regenerated shots left in the working tree and the committed ones
      #    from HEAD) plus a per-shot pixel-diff image and machine diagnostics,
      #    so the difference class can be named offline instead of guessed.
      #    Scope: exactly this step + `if` check — the artifact is short-lived
      #    (7d retention; artifact storage is 500 MB and shared, see AGENTS.md).
      - name: Drift gate failure — gather regenerated + committed shot bytes
        id: drift_gather
        if: failure() && steps.drift_gate.outcome == 'failure'
        run: |
          ART="$RUNNER_TEMP/shots-drift-failure"
          rm -rf "$ART" && mkdir -p "$ART/committed" "$ART/regenerated"
          # Regenerated = run-2 output saved by the drift step before it restored
          # the exempt shots (includes the four BET-537 chat shots, so the pair
          # can be diffed offline even though the gate skips them).
          cp "$RUNNER_TEMP/shots-fail-regen"/*.webp "$ART/regenerated"/ 2>/dev/null || true
          # Committed = the pair from HEAD, so the two can be diffed offline.
          for f in website/shot-*.webp website/hero-poster.webp; do
            [ -f "$f" ] || continue
            b="$(basename "$f")"
            git show "HEAD:$f" > "$ART/committed/$b" 2>/dev/null || true
          done
          # Machine diagnostics to disambiguate font vs GPU vs scale vs timezone
          # render differences.
          { echo "== git HEAD =="; git rev-parse HEAD; fc-list 2>/dev/null | sort; \
            node -e '
              const { chromium } = require("playwright");
              (async () => {
                const c = await chromium.launch({ headless: true, args: ["--font-render-hinting=none"] });
                console.log("chromium " + await c.version());
                await c.close();
              })().catch(() => {});
            '; } > "$ART/machine.txt" 2>/dev/null || true
          # Per-shot pixel diffs (regenerated vs committed) → report.txt + *.diff.png.
          # The script creates diff/ itself (mkdirSync recursive) and writes
          # report.txt, so no shell redirect to a pre-existing dir is needed.
          node scripts/shots-drift-diff.mjs "$ART"

      - name: Drift gate failure — upload shot byte sets
        if: failure() && steps.drift_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: shots-drift-failure-${{ github.event.pull_request.number || github.sha }}
          path: ${{ runner.temp }}/shots-drift-failure/**/*
          if-no-files-found: warn
          retention-days: 7

      # ── Visual gate — every screen in scripts/visual/screens.mjs is checked
      #    for structure (accessibility-tree snapshot) and pixels (screenshot
      #    vs committed baseline). See docs/visual-verification.md.
      #
      #    Why this is a STEP in the required job, not a new job: it shares the
      #    app's checkout + Playwright install with the rest of the gate. It is
      #    deterministic by construction — fixture-backed
      #    demo transport, no network, animations disabled, selector-gated
      #    waits, and Playwright's version-pinned Chromium (NOT system Chrome,
      #    which auto-updates and would silently invalidate every baseline).
      #    So it blocks, like the other gates here.
      #
      #    Cost: builds the renderer (~13s) + ~3s per screen. The browser is
      #    restored from the same Playwright cache the E2E job uses.
      #
      #    Baselines are regenerated deliberately with `npm run visual:update`
      #    and reviewed as part of the diff — never auto-updated in CI, which
      #    would make the gate unfalsifiable.
      #
      #    The pinned Chromium was installed above (before the drift gate), so
      #    the visual gate reuses it from the shared cache.
      - name: Visual gate (structure + pixel baselines)
        run: npm run visual

      # ── Security gates (moved verbatim from security-gates.yml, now deleted.
      #    Same detectors, same blocking behaviour, no extra runner slot) ────
      #
      # gitleaks over the full history. The allowlist in .gitleaks.toml covers
      # ONLY the built bundle outputs (verified false positives); real
      # source is fully scanned. THE reason this repo needs it: agents write
      # most commits now, and an agent pasting a live token into code or docs
      # must fail deterministically, not depend on reviewer attention.
      #
      # Version-pinned into a per-version cache path, so the binary downloads
      # once per runner rather than on every run, and a gitleaks release can
      # never silently change the gate's behaviour.
      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.24.3
          BIN="$HOME/.cache/gitleaks/${GITLEAKS_VERSION}/gitleaks"
          if [ ! -x "$BIN" ]; then
            mkdir -p "$(dirname "$BIN")"
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar xz -C "$(dirname "$BIN")"
          fi
          "$BIN" detect --source . --config .gitleaks.toml --log-level=warn \
            --exit-code 1 --report-format json --report-path gitleaks-report.json \
            || { cat gitleaks-report.json; exit 1; }

      # npm audit scoped to PRODUCTION deps at high+: dev toolchain advisories
      # (the vite/electron chain) are chronic noise with breaking-change fixes;
      # shipped-code advisories are the signal.
      #
      # An audit's result depends ONLY on the dependency set, not on this PR's
      # code. Auditing a PR that doesn't touch package*.json re-measures main,
      # which means the day a new upstream advisory lands EVERY open PR goes red
      # at once through no fault of its own — with a backlog in flight that is a
      # mass-block event. tenanture hit it five times (TEN-574/585/588/589/606)
      # before splitting it this way. dep-audit-nightly.yml covers main daily,
      # so an advisory surfaces as one red run and one fix issue instead.
      - name: Dependency audit (only when the PR changes the dependency set)
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only "$(git merge-base origin/main HEAD)" HEAD -- package.json package-lock.json | grep -q .; then
            npm audit --omit=dev --audit-level=high
          else
            echo "package.json / package-lock.json unchanged vs merge-base — the audit would be identical to main's. Skipping (dep-audit-nightly.yml covers main)."
          fi

      # ── Advisory duplication report (moved verbatim from anti-spaghetti.yml,
      #    now deleted). NON-BLOCKING by design and deliberately NOT a required
      #    check: jscpd on a diff is noisy (coincidental clones, the intentional
      #    desktop/mobile transport mirrors), so a hard gate would block nearly
      #    every PR. The signal is computed once and posted as a sticky PR
      #    comment; the manta-reviewer agent READS it and exercises judgment.
      #    CI never decides. Detector logic lives in scripts/check-duplication.sh
      #    so the reviewer can run the identical script when the comment is
      #    missing. The blocking half is the separate duplication-gate job. ──
      - name: Duplication report (advisory)
        if: github.event_name == 'pull_request'
        run: |
          # Never fail the job on detector output — this is a signal, not a gate.
          bash scripts/check-duplication.sh "origin/${{ github.base_ref }}" \
            > /tmp/anti-spaghetti-report.md 2>&1 || true
          echo "Report written ($(wc -l < /tmp/anti-spaghetti-report.md) lines)."

      - name: Post / update duplication sticky comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/anti-spaghetti-report.md', 'utf8');
            const marker = '<!-- anti-spaghetti-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  # STRICT duplication gate — the blocking half of the anti-spaghetti
  # discipline. Deliberately NOT a required check (de-required 2026-07-02:
  # flaky at token boundaries, it blocked BET-57/PR#27, and agents cannot rerun
  # CI). It still runs and still goes red, which is the signal the PM and
  # reviewer read.
  #
  # It restores the same node_modules cache as the job above, so `npx jscpd`
  # resolves the version pinned in package.json instead of fetching the latest
  # from npm on every run — faster, and it closes the local-vs-CI version drift
  # that BET-220 flagged.
  duplication-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}
      - name: Strict duplication gate
        run: bash scripts/check-duplication-gate.sh "origin/${{ github.base_ref }}"

  # The BET-9 e2e smoke gate. NOT in required-checks.json (Electron+Xvfb on the
  # runner is flakier than the deterministic gates); the PM treats a red
  # e2e-smoke as a judgment call, a red typecheck-test as an absolute stop.
  e2e-smoke:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Playwright's pinned Chromium — same shared unit the drift gate uses,
      # so both capture gates drive the identical browser. --with-deps needs
      # sudo apt and is only required the first time on a given runner.
      - uses: ./.github/actions/cache-playwright-browsers

      - name: Run E2E smoke tests
        # xvfb-run: script needs a display for headless Electron but does not
        # start one itself (relied on the old self-hosted box's display).
        # `-a` auto-allocates a free server on the GitHub-hosted runner.
        run: xvfb-run -a bash scripts/check-e2e-smoke.sh
