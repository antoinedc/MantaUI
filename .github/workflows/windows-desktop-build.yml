# Windows desktop build — NSIS installer for internal testing.
#
# WHY THIS EXISTS
# ---------------
# `electron-builder.yml` has carried a `win: nsis` target for a long time but
# nothing ever built it: `scripts/release/desktop.sh` passes `--mac --linux`,
# and the Codemagic `mac-desktop` workflow runs on a Mac. This workflow is the
# missing Windows leg.
#
# WHAT IT PRODUCES
#   dist/desktop/Manta-UI-<version>-x64.exe   — the NSIS installer
#   dist/desktop/latest.yml                   — the electron-updater feed file
#
# WHERE IT GOES
#   Tag push → a GitHub Release on that tag, with the .exe attached. That is
#   the download link you hand a tester. Marked PRERELEASE, deliberately: the
#   installer is unsigned, and it must not present itself as the project's
#   latest official release.
#   Manual dispatch → the workflow ARTIFACT only (a dispatch has no tag, so
#   there is no release to attach to).
#
#   The repo is PRIVATE, so a release asset needs a GitHub account with access
#   to download. That is fine for internal testing and is the whole reason
#   this is a Release rather than the public website.
#
# WHAT IS STILL NOT PUBLISHED, ON PURPOSE
#   Nothing reaches mantaui.com: no download-page link, and `latest.yml` is
#   never uploaded to https://mantaui.com/updates/, so a Windows build's
#   auto-update check 404s (src/main/autoUpdate.ts only console.warns, so this
#   is invisible to the user — they simply never get an update, and you re-send
#   a release link instead). Both are blocked on code signing: an unsigned
#   installer trips SmartScreen for every visitor, which is worse than not
#   offering Windows at all. When an OV/EV certificate exists, add a publish
#   job modelled on server-tarball-deploy.yml's (scp to
#   /var/www/mantaui/{downloads,updates}, then verify the URL is 200 and
#   sha-matches) — and only then link it from the website.
#
#   `latest.yml` is still built here, and its absence fails the job, so the
#   feed is complete the day that happens.
#
# BUILD HOST
#   GitHub-hosted `windows-latest`. The repo's own runner is Linux, and
#   electron-builder needs a real Windows host to produce and resource-edit a
#   Windows executable without Wine. Using a GitHub-hosted runner also means
#   this build never queues behind PRs on the single self-hosted runner.
#
#   electron-builder itself compiles nothing: electron-builder.yml sets
#   `npmRebuild: false` and excludes node-pty from the package, because the
#   desktop app imports no native module (only `electron`, `electron-updater`
#   and `yaml`). `npm ci` DOES still install node-pty — it is a `dependencies`
#   entry for the box server — and node-pty's own install script fetches a
#   prebuilt binding and falls back to `node-gyp rebuild`. windows-latest ships
#   the MSVC + Python toolchain that fallback needs. If this job ever fails
#   during `npm ci` with a node-gyp error, that is the cause, and the fix is a
#   node-pty prebuild, not a change here.
#
# TRIGGER: push a tag matching win-v* (e.g. win-v0.0.13) — that is what
#   produces a downloadable release. Also runnable manually via
#   workflow_dispatch for a throwaway build, which lands as an artifact only.

name: Windows desktop build

on:
  push:
    tags:
      - "win-v*"
  workflow_dispatch:

concurrency:
  group: windows-desktop-build
  cancel-in-progress: false

permissions:
  # write is required to create the Release and upload the installer to it.
  contents: write

defaults:
  run:
    # Git Bash, present on every windows-latest image. Keeps these steps
    # byte-identical in shape to the repo's other workflows instead of
    # introducing a second (PowerShell) dialect for the same commands.
    shell: bash

jobs:
  build:
    name: build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main bundles
        run: npm run build

      - name: Build the installer
        # --publish never: emit latest.yml next to the .exe but upload
        # nothing. Same flag scripts/release/desktop.sh uses for mac/linux.
        run: npx electron-builder --win --publish never

      # Fail loudly rather than uploading an empty artifact. electron-builder
      # can exit 0 having produced nothing if a target is misconfigured.
      - name: Verify artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          EXES=( dist/desktop/*.exe )
          if [ "${#EXES[@]}" -eq 0 ]; then
            echo "✗ no .exe in dist/desktop/ — the win target produced nothing" >&2
            ls -la dist/desktop/ || true
            exit 1
          fi
          if [ ! -f dist/desktop/latest.yml ]; then
            echo "✗ dist/desktop/latest.yml missing — the update feed would 404" >&2
            exit 1
          fi
          for f in "${EXES[@]}"; do
            echo "$(sha256sum "$f")"
          done
          cat dist/desktop/latest.yml

      - uses: actions/upload-artifact@v4
        with:
          name: manta-windows-installer
          path: |
            dist/desktop/*.exe
            dist/desktop/latest.yml
          if-no-files-found: error
          retention-days: 30

      # Tag pushes only — a workflow_dispatch run has no tag to hang a release
      # on, and the artifact above already covers that case.
      #
      # `gh` is preinstalled on the runner image; no third-party action and no
      # extra secret. `--clobber` makes a re-run of the same tag replace the
      # asset instead of failing, so a retried build is not a dead end.
      - name: Publish the installer to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Manta UI for Windows — $TAG" \
              --prerelease \
              --notes 'Unsigned internal build. Windows SmartScreen will warn on first run: **More info → Run anyway**. Per-user install, no admin rights needed. Auto-update is not wired up for Windows — grab the next release from here.'
          fi
          gh release upload "$TAG" dist/desktop/*.exe --clobber
          gh release view "$TAG" --json url --jq .url
