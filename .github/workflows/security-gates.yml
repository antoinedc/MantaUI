# Security gates — ported from leasebot/tenanture. Both jobs are REQUIRED
# checks (required-checks.json + branch protection).
#
#   secret-scan — gitleaks over the full history. Allowlist in .gitleaks.toml
#     covers ONLY the built mobile/www bundles (verified false positives);
#     real source is fully scanned. THE reason this repo needs it: agents
#     write most commits now, and an agent pasting a live token into code or
#     docs must fail deterministically, not depend on reviewer attention.
#
#   dep-audit — npm audit scoped to PRODUCTION deps at high+. Dev toolchain
#     advisories (vite/electron chain) are chronic noise with breaking-change
#     fixes; shipped-code advisories are the signal. ws DoS (GHSA-96hv-2xvq-fx4p)
#     was fixed when this gate landed.
#
# THESE TWO JOBS EXIST SEPARATELY ONLY BECAUSE THEY ARE NAMED REQUIRED CONTEXTS
# in the `main` branch ruleset — GitHub-side config this repo cannot edit from
# CI. On a single self-hosted runner every job is queue time every other PR
# waits behind, so the intended end state is both of these as STEPS of
# `typecheck-test` (tenanture TEN-618 did exactly that). Migration, in order:
#   1. Drop `secret-scan` and `dep-audit` from the ruleset's required contexts.
#      This MUST come first — a required context no job produces blocks every
#      PR forever.
#   2. Move both steps into ci.yml's typecheck-test job, shrink
#      required-checks.json to ["typecheck-test"], and delete this file.

name: security-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version-pinned into a per-version cache path, so the binary is
      # downloaded once per runner rather than fetched on every run, and a
      # gitleaks release can never silently change the gate's behaviour.
      - name: Scan for secrets (gitleaks)
        run: |
          GITLEAKS_VERSION=8.24.3
          BIN="$HOME/.cache/gitleaks/${GITLEAKS_VERSION}/gitleaks"
          if [ ! -x "$BIN" ]; then
            mkdir -p "$(dirname "$BIN")"
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar xz -C "$(dirname "$BIN")"
          fi
          "$BIN" detect --source . --config .gitleaks.toml --log-level=warn \
            --exit-code 1 --report-format json --report-path gitleaks-report.json \
            || { cat gitleaks-report.json; exit 1; }

  dep-audit:
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Full history so the merge-base diff below can resolve.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available (merge-base source)
        run: git fetch --no-tags --depth=1 origin main 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # An audit's result depends ONLY on the dependency set, not on this PR's
      # code. Auditing a PR that doesn't touch package*.json re-measures main,
      # which means the day a new upstream advisory lands EVERY open PR goes red
      # at once through no fault of its own — with a backlog in flight that is a
      # mass-block event. tenanture hit it five times (TEN-574/585/588/589/606)
      # before splitting it this way. dep-audit-nightly.yml covers main daily,
      # so an advisory surfaces as one red run and one fix issue instead.
      - name: Audit production dependencies (only when the PR changes them)
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only "$(git merge-base origin/main HEAD)" HEAD -- package.json package-lock.json | grep -q .; then
            npm audit --omit=dev --audit-level=high
          else
            echo "package.json / package-lock.json unchanged vs merge-base — the audit would be identical to main's. Skipping (dep-audit-nightly.yml covers main)."
          fi
