name: Multica Close on Merge

on:
  pull_request_target:
    types: [closed]
  # Safety net: a status can also change outside a PR (set by hand, or by an
  # agent). Hourly sweep catches those without waiting for the next merge.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    name: Close or comment on BET issue
    if: github.event_name == 'pull_request_target'
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Extract BET issue key
        id: extract
        shell: bash
        run: |
          KEY=""
          # Try PR title first
          if [[ "${{ github.event.pull_request.title }}" =~ BET-([0-9]+) ]]; then
            KEY="BET-${BASH_REMATCH[1]}"
          # Then branch name
          elif [[ "${{ github.head_ref }}" =~ BET-([0-9]+) ]]; then
            KEY="BET-${BASH_REMATCH[1]}"
          fi
          if [[ -z "$KEY" ]]; then
            echo "no_issue=true" >> "$GITHUB_OUTPUT"
            echo "No BET-N issue key found in PR title or branch."
            exit 0
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Found issue: $KEY"

      - name: Set issue to done (merged)
        if: steps.extract.outputs.no_issue != 'true' && github.event.pull_request.merged == true
        shell: bash
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://api.multica.ai/api/issues/${{ steps.extract.outputs.key }}?workspace_id=264c89bb-4659-4570-af7b-5f8daaf87985" \
            -H "Authorization: Bearer ${{ secrets.MULTICA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "done"
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP $HTTP_CODE"
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
            echo "Set ${{ steps.extract.outputs.key }} to done."
          else
            echo "Warning: failed to update issue (HTTP $HTTP_CODE): $BODY"
          fi
        continue-on-error: true

      - name: Comment on PR (closed without merge)
        if: steps.extract.outputs.no_issue != 'true' && github.event.pull_request.merged != true
        uses: actions/github-script@v7
        with:
          script: |
            const key = "${{ steps.extract.outputs.key }}";
            const wsId = "264c89bb-4659-4570-af7b-5f8daaf87985";
            const prNumber = context.payload.pull_request.number;
            const prUrl = context.payload.pull_request.html_url;
            const comment = `This PR was closed without merging. Marking **${key}** as still open — please reopen or close the issue manually if it's no longer applicable.`;

            // Post comment via Multica API if available
            try {
              const resp = await fetch("https://api.multica.ai/api/issues/" + key + "/comments", {
                method: "POST",
                headers: {
                  "Content-Type: application/json",
                  "Authorization": "Bearer " + process.env.MULTICA_TOKEN,
                },
                body: JSON.stringify({
                  workspace_id: wsId,
                  body: comment,
                }),
              });
              if (resp.ok) {
                console.log("Posted comment to " + key + " via Multica.");
              } else {
                console.log("Multica comment failed (HTTP " + resp.status + "), continuing.");
              }
            } catch (e) {
              console.log("Multica comment error: " + e.message + ", continuing.");
            }

            // Also post a GitHub PR comment for visibility
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment,
            });

      - name: Done
        if: always()
        run: echo "Multica close-on-merge step completed."

  # ---------------------------------------------------------------------------
  # Clear stale `blocked` statuses whose blockers have since finished.
  #
  # The PM agent writes `metadata.waiting_on` as a one-off snapshot when it
  # blocks an issue; nothing re-reads it when the blockers land. Without this,
  # an issue stays `blocked` indefinitely after its dependencies are done —
  # observed live when BET-297 sat blocked on BET-294/BET-295 for an hour after
  # both had merged, stalling the whole website epic until a human noticed.
  #
  # Runs after `close` so the just-merged issue is already `done` and counts.
  # ---------------------------------------------------------------------------
  unblock:
    name: Unblock issues whose blockers are done
    needs: [close]
    # `needs` on a skipped job would skip this too, so accept that case
    # explicitly: run on schedule/dispatch, or after a merge.
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.merged == true)
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconcile blocked issues
        env:
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
        run: node scripts/multica-unblock.mjs --verbose
        # Housekeeping must never fail a merge pipeline.
        continue-on-error: true
