# Codemagic CI/CD — iOS TestFlight + macOS desktop (Electron) distribution.
#
# BET-601 (S9): the iOS TestFlight workflow was restored after BET-559 removed
# it (with the Capacitor shell). It now builds the NATIVE app in mobile/native
# (xcodegen → MantaUI.xcodeproj, scheme `MantaUI`) instead of the retired
# Capacitor wrapper in mobile/ios. The mac-desktop workflow is unchanged.
#
# WHY CODEMAGIC (not Xcode Cloud): Xcode Cloud built + signed fine but could
# NEVER authenticate to upload the binary to App Store Connect ("Session Proxy
# Provider Code=1" — a known Xcode Cloud auth bug). Codemagic uploads via the
# App Store Connect API key, which authenticates reliably. Do not reintroduce
# Xcode Cloud.
#
# ONE-TIME SETUP IN THE CODEMAGIC WEB UI (you do this once):
#   1. Sign up at codemagic.io, connect the GitHub repo antoinedc/MantaUI.
#   2. iOS: the ASC API key integration must be named "APS Key" (referenced
#      below as app_store_connect: APS Key). The persistent iOS distribution
#      private key lives in the "ios_signing" env group as
#      CERTIFICATE_PRIVATE_KEY.
#   3. Desktop: create the "Developer ID Application" cert + wire the env
#      groups as documented in the mac-desktop workflow below.
#
# TRIGGER: a git tag matching ios-v* (iOS) or mac-v* (desktop); the tag prefix
#   routes each build so one never fires the other. iOS tags are usually
#   created automatically by .github/workflows/ios-release-tag.yml on merge to
#   main (reads MARKETING_VERSION from mobile/native/project.yml).

workflows:
  # ---------------------------------------------------------------------------
  # iOS native (mobile/native) → signed .ipa → TestFlight
  # ---------------------------------------------------------------------------
  # Restored in BET-601. Builds the SwiftUI app in mobile/native: xcodegen
  # generates MantaUI.xcodeproj from project.yml (the source of truth), then a
  # distribution cert + App Store profile are created on the build machine from
  # the PERSISTENT private key (CERTIFICATE_PRIVATE_KEY in the ios_signing env
  # group), and the archive is uploaded to TestFlight via the ASC API key.
  #
  # PRIVATE-KEY CUSTODY is the crux: a distribution certificate is only usable
  # by whoever holds its private key, so the key lives on the build machine and
  # the cert is created FROM it. Do NOT go back to a per-build throwaway key —
  # each such build minted a new cert whose key died with the VM; after 2
  # builds the account's cert quota (max 2/type) filled with unusable certs and
  # signing silently produced zero profiles (the ios-v1.0.8 outage, c899c89).
  ios-testflight:
    name: MantaUI iOS → TestFlight
    instance_type: mac_mini_m2      # 500 free M2 minutes/month
    max_build_duration: 60
    integrations:
      app_store_connect: APS Key  # MUST match the ASC API key integration name in the Codemagic UI exactly (Team > Integrations > Developer Portal)
    environment:
      # NOTE: no declarative `ios_signing:` block on purpose. That block makes
      # Codemagic resolve signing at environment-setup time (before scripts run)
      # and fails with "No matching profiles found" if the profile doesn't
      # already exist. Instead the "Set up code signing" script below runs
      # `app-store-connect fetch-signing-files --create`, which CREATES the
      # distribution cert + App Store profile via the ASC API key if missing.
      groups:
        # ios_signing holds CERTIFICATE_PRIVATE_KEY — the PERSISTENT RSA key
        # (secure app variable, uploaded via the Codemagic API; durable copy at
        # ~/.manta/ios-dist-key.pem on the box). One stable key ⇒ one stable
        # distribution cert reused across builds.
        - ios_signing
      vars:
        BUNDLE_ID: "com.antoinedc.mantaui"
        APP_STORE_APPLE_ID: 6792363427
        XCODE_PROJECT: "mobile/native/MantaUI.xcodeproj"
        XCODE_SCHEME: "MantaUI"
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Generate Xcode project from project.yml (xcodegen)
        script: |
          # mobile/native/project.yml is the source of truth; MantaUI.xcodeproj
          # is derived from it (xcodegen). Generate it so the pbxproj can never
          # drift from the spec — this is what keeps MARKETING_VERSION + the
          # bundle id correct even if only project.yml was bumped. The generated
          # project is deterministic, so re-generating over the checked-in file
          # is a no-op when they already match.
          brew install xcodegen
          cd mobile/native
          xcodegen generate
      - name: Set up code signing (App Store profile via ASC API key)
        script: |
          # THE PRIVATE-KEY REQUIREMENT: a distribution certificate is only
          # usable for signing by whoever holds its PRIVATE KEY. The key comes
          # from the PERSISTENT secure variable CERTIFICATE_PRIVATE_KEY
          # (ios_signing group) so every build reuses the SAME key and the SAME
          # cert. A per-build throwaway key minted a new cert every build until
          # the 2-cert quota filled with certs whose keys were lost — then
          # signing silently produced zero profiles (ios-v1.0.8).
          keychain initialize

          # 1. Materialize the persistent private key.
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/dist_key
          chmod 600 /tmp/dist_key

          # 2. Create the distribution certificate FROM that key via the ASC API
          #    key — first run only; afterwards it 409s (cert exists) and the
          #    fallback `list` finds the existing cert matching our key.
          #    --save stores the resulting cert next to the key so
          #    fetch/keychain steps can find both.
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:/tmp/dist_key \
            --save || \
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:/tmp/dist_key \
            --save

          # 3. Fetch signing files, passing the SAME private key so Codemagic can
          #    match the cert to its key and build a usable p12 + create the
          #    App Store provisioning profile for the bundle id.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/dist_key \
            --create

          # 4. Import the certificate(s) into the keychain.
          keychain add-certificates

          # 5. Write the profile's specifier into the Xcode project + the export
          #    options plist that build-ipa consumes. This also converts the
          #    project's `CODE_SIGN_STYLE = Automatic` (project.yml) to Manual
          #    with the fetched profile, so the archive resolves a concrete cert.
          xcode-project use-profiles \
            --export-options-plist "$CM_BUILD_DIR/export_options.plist"
      - name: Build + archive .ipa
        script: |
          # use-profiles (previous step) set the project to manual signing with
          # the fetched App Store profile and wrote the export options plist to
          # $CM_BUILD_DIR/export_options.plist. Feed it so the archive + export
          # have a concrete profile (fixes "app requires a provisioning
          # profile"). Force the team so manual signing resolves. No pods, so a
          # --project rather than the Capacitor era's --workspace.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "DEVELOPMENT_TEAM=FSQ3HS4Z24" \
            --export-options-plist "$CM_BUILD_DIR/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration          # use the ASC API key integration
        submit_to_testflight: true
        # Internal testers get it automatically once processing completes.
        # No App Store review needed for internal TestFlight.

  # ---------------------------------------------------------------------------
  # macOS desktop (Electron) → signed + notarized DMG → mantaui.com
  # ---------------------------------------------------------------------------
  # Distributes the desktop app OUTSIDE the App Store (beta). electron-builder
  # signs with a "Developer ID Application" cert and notarizes via the ASC API
  # key, then the DMG + latest-mac.yml auto-update feed are published to the
  # prod box (mantaui.com/downloads + /updates).
  #
  # CHANNEL (prod | staging): `MANTA_CHANNEL` env var drives the channel.
  # Defaults to `prod`; tag triggers keep meaning prod and resolve via the
  # default. Staging is on-demand ONLY — the box triggers a staging build by
  # setting `environment.variables.MANTA_CHANNEL=staging` on the Codemagic
  # REST API start call. When staging, the build is overlaid with
  # `electron-builder.staging.yml` (different appId / productName / protocol /
  # update feed) and the publish step writes to /var/www/mantaui/staging/...
  # instead of /var/www/mantaui/... (BET-371).
  #
  # ONE-TIME SETUP IN THE CODEMAGIC WEB UI (see docs/mac-beta-distribution.md):
  #   1. Create a "Developer ID Application" cert on a Mac (Xcode → Settings →
  #      Accounts → Manage Certificates → + → Developer ID Application), export
  #      it as a .p12 with a password.
  #   2. Codemagic UI → this app → Environment variables, group "mac_signing":
  #        - CSC_LINK               = the .p12, base64-encoded, marked "secure"
  #                                   (base64 -i cert.p12 | pbcopy)
  #        - CSC_KEY_PASSWORD       = the .p12 password, "secure"
  #        - APPLE_ID               = your Apple ID email, "secure"
  #        - APPLE_APP_SPECIFIC_PASSWORD = app-specific pw (appleid.apple.com), "secure"
  #        - APPLE_TEAM_ID          = FSQ3HS4Z24
  #   3. For publishing to the prod box, group "prod_deploy":
  #        - PROD_SSH_KEY           = a base64 private key with access to
  #                                   root@91.107.196.2, "secure"
  #      (Or skip publishing and download the DMG from Codemagic artifacts.)
  #
  # TRIGGER: git tag matching mac-v* (kept separate from ios-v* so an iOS tag
  #   doesn't fire a mac build and vice-versa). Also runnable from the UI.
  mac-desktop:
    name: MantaUI macOS → DMG (Developer ID, notarized)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: APS Key
    environment:
      groups:
        # Mac signing + deploy + notarization vars live in the "mantaui" group:
        #   CSC_LINK            — Developer ID .p12, base64 (app + DMG signing)
        #   CSC_KEY_PASSWORD    — .p12 password
        #   APPLE_TEAM_ID       — FSQ3HS4Z24
        #   ASC_API_KEY_P8_B64  — base64 of the App Store Connect .p8 (notarization)
        #   ASC_API_KEY_ID      — the 10-char ASC key id
        #   ASC_ISSUER_ID       — the ASC issuer UUID
        #   PROD_SSH_KEY        — (optional) base64 deploy key for mantaui.com
        # Notarization uses the ASC .p8 from ASC_API_KEY_P8_B64 (a real secure var,
        # NOT the "APS Key" integration — that integration only feeds the
        # app-store-connect CLI implicitly and does NOT expose the full key as a
        # shell variable). APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD are unused.
        - mantaui
      # Channel resolution (BET-371). Codemagic env vars default to "" when
      # unset; we coerce to `prod` so a tag-triggered run is unambiguously prod
      # regardless of how the REST API was last invoked. The REST API override
      # (for staging) passes environment.variables.MANTA_CHANNEL=staging — see
      # AGENTS.md "Staging channel" subsection.
      vars:
        MANTA_CHANNEL: "prod"
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "mac-v*"
          include: true
    scripts:
      - name: Provide distutils for node-gyp (Python 3.12+)
        script: |
          # electron-builder rebuilds the native node-pty module via node-gyp,
          # which imports Python's `distutils`. Python 3.12 (the Codemagic M2
          # default) REMOVED distutils from the stdlib, so the rebuild fails with
          # "ModuleNotFoundError: No module named 'distutils'". `setuptools`
          # re-provides a distutils shim. Install it into the runner's python3.
          python3 -m pip install --upgrade "setuptools<81" || pip3 install "setuptools<81"
      - name: Install deps
        script: |
          npm ci
      - name: Resolve + guard channel (BET-371)
        script: |
          # Coerce the channel here too (env.vars default is "" on Codemagic if
          # unset, even with vars: { MANTA_CHANNEL: prod }) and fail RED if a
          # staging build is asked to write to a non-staging destination. This
          # is the codemagic.yaml analogue of the /staging/ guard in
          # website-deploy.yml / server-tarball-deploy.yml — same contract.
          set -euo pipefail
          CHANNEL="${MANTA_CHANNEL:-prod}"
          case "$CHANNEL" in
            prod|staging) ;;
            *) echo "::error::MANTA_CHANNEL='$CHANNEL' must be 'prod' or 'staging'"; exit 1 ;;
          esac
          if [ "$CHANNEL" = "staging" ]; then
            FEED_DIR='/var/www/mantaui/staging/updates'
            DOWNLOADS_DIR='/var/www/mantaui/staging/downloads'
            LATEST_DMG='Manta-Staging-latest.dmg'
          else
            FEED_DIR='/var/www/mantaui/updates'
            DOWNLOADS_DIR='/var/www/mantaui/downloads'
            LATEST_DMG='Manta-latest.dmg'
          fi
          # Guard: prod destinations must NOT contain /staging/; staging
          # destinations MUST contain /staging/. Belt-and-braces against a
          # future refactor that accidentally drops the channel suffix.
          if [ "$CHANNEL" = "staging" ]; then
            [[ "$FEED_DIR" == */staging* ]] || { echo "::error::staging but FEED_DIR='$FEED_DIR' lacks /staging/"; exit 1; }
            [[ "$DOWNLOADS_DIR" == */staging* ]] || { echo "::error::staging but DOWNLOADS_DIR='$DOWNLOADS_DIR' lacks /staging/"; exit 1; }
          else
            [[ "$FEED_DIR" != */staging* ]] || { echo "::error::prod but FEED_DIR='$FEED_DIR' contains /staging/"; exit 1; }
            [[ "$DOWNLOADS_DIR" != */staging* ]] || { echo "::error::prod but DOWNLOADS_DIR='$DOWNLOADS_DIR' contains /staging/"; exit 1; }
          fi
          echo "▸ channel=$CHANNEL feed=$FEED_DIR downloads=$DOWNLOADS_DIR latest=$LATEST_DMG"
          # Export for the rest of the script (electron-builder, publish, ...).
          echo "MANTA_CHANNEL=$CHANNEL"               >> "$CM_ENV"
          echo "MANTA_FEED_DIR=$FEED_DIR"             >> "$CM_ENV"
          echo "MANTA_DOWNLOADS_DIR=$DOWNLOADS_DIR"   >> "$CM_ENV"
          echo "MANTA_LATEST_DMG=$LATEST_DMG"         >> "$CM_ENV"
      - name: Decode + import Developer ID cert into the keychain
        script: |
          # electron-builder reads CSC_LINK as a FILE PATH or a base64 string; we
          # stored the .p12 base64 in CSC_LINK. Write it to a temp file (for
          # electron-builder) AND import it into the Codemagic CLI keychain so
          # `security find-identity` + our standalone `codesign` on the DMG (a
          # later step) can resolve the Developer ID Application identity. Without
          # the import, electron-builder's own throwaway keychain is gone by the
          # time we sign the DMG and find-identity returns nothing.
          set -e
          KEYCHAIN_CERT="$CM_BUILD_DIR/dist_cert.p12"
          echo "$CSC_LINK" | base64 --decode > "$KEYCHAIN_CERT"
          keychain initialize
          keychain add-certificates --certificate "$KEYCHAIN_CERT" --certificate-password "$CSC_KEY_PASSWORD"
          # Re-export CSC_LINK as the file path for the electron-builder step.
          echo "CSC_LINK=$KEYCHAIN_CERT" >> "$CM_ENV"
      - name: Materialize ASC API key for notarization
        script: |
          # Notarization authenticates with an App Store Connect API key (.p8),
          # NOT an Apple-ID app-specific password. We do NOT rely on the "APS Key"
          # INTEGRATION exposing the key as a shell variable — it does not: the
          # working ios-testflight workflow consumes the integration only through
          # the `app-store-connect` CLI (which reads it implicitly), and
          # $APP_STORE_CONNECT_PRIVATE_KEY came through as a 72-char stub, breaking
          # notarytool. Instead the FULL .p8 is stored as a dedicated secure
          # environment variable ASC_API_KEY_P8_B64 (base64 of the raw .p8) plus
          # ASC_API_KEY_ID / ASC_ISSUER_ID, all in the "mantaui" group. Decode it.
          set -e
          if [ -z "${ASC_API_KEY_P8_B64:-}" ]; then
            echo "ASC_API_KEY_P8_B64 is not set. Add it (base64 of the ASC .p8) to the"
            echo "Codemagic 'mantaui' env group, plus ASC_API_KEY_ID and ASC_ISSUER_ID."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          ASC_KEY_FILE="$CM_BUILD_DIR/asc-api-key.p8"
          printf '%s' "$ASC_API_KEY_P8_B64" | base64 --decode > "$ASC_KEY_FILE"
          chmod 600 "$ASC_KEY_FILE"
          # DEFENSIVE PEM NORMALIZATION: the base64 should already decode to a
          # multi-line PEM, but if whoever set ASC_API_KEY_P8_B64 encoded a
          # newline-FLATTENED key (the box's ASC_API_KEY_P8 secret stores it with
          # spaces instead of newlines — the Secrets card flattens it), the decoded
          # file is one line and `openssl pkey` / notarytool reject it. Rebuild the
          # PEM from the pure base64 body so either input shape works.
          if ! openssl pkey -in "$ASC_KEY_FILE" -noout 2>/dev/null; then
            BODY=$(sed -E 's/-----BEGIN [A-Z ]*PRIVATE KEY-----//; s/-----END [A-Z ]*PRIVATE KEY-----//' "$ASC_KEY_FILE" \
              | sed 's/\\n//g' | tr -d ' \t\r\n')
            {
              echo "-----BEGIN PRIVATE KEY-----"
              printf '%s' "$BODY" | fold -w 64
              echo ""
              echo "-----END PRIVATE KEY-----"
            } > "$ASC_KEY_FILE"
            chmod 600 "$ASC_KEY_FILE"
          fi
          # Validate it is a parseable EC private key (read-only check).
          if ! openssl pkey -in "$ASC_KEY_FILE" -noout 2>/dev/null; then
            echo "Decoded ASC .p8 is not a parseable EC private key — check ASC_API_KEY_P8_B64."
            echo "First line: $(head -1 "$ASC_KEY_FILE") | lines: $(wc -l < "$ASC_KEY_FILE")"
            exit 1
          fi
          echo "OK: ASC .p8 decoded + parsed ($(wc -l < "$ASC_KEY_FILE") lines)."
          echo "ASC_KEY_FILE=$ASC_KEY_FILE" >> "$CM_ENV"
          echo "OK: ASC .p8 written as valid PEM ($(wc -l < "$ASC_KEY_FILE") lines)."
          echo "ASC_KEY_FILE=$ASC_KEY_FILE" >> "$CM_ENV"
      - name: Build + sign app + notarize the .app inside the DMG
        script: |
          # electron-vite build → electron-builder --mac. electron-builder:
          #   - signs the .app with the Developer ID cert (CSC_LINK/CSC_KEY_PASSWORD)
          #   - notarizes + staples the .app INSIDE the bundle via the ASC API key
          #     (APPLE_API_KEY* env, @electron/notarize). electron-builder.yml has
          #     mac.notarize:false for the beta, so override it here on the CLI.
          # IMPORTANT: electron-builder does NOT sign or notarize the OUTER .dmg —
          # that is done in the next two steps. A DMG left unsigned is notarizable
          # but Gatekeeper REJECTS it on open ("source=no usable signature")
          # because there is no code signature to anchor the ticket to. This was
          # THE mac-desktop notarization bug.
          #
          # CHANNEL (BET-371): MANTA_CHANNEL=staging is exported into the env by
          # the "Resolve + guard channel" step ABOVE this one — electron.vite
          # reads it via `__MANTA_CHANNEL__` (see electron.vite.config.ts). On
          # staging, we ALSO overlay `electron-builder.staging.yml` (which
          # changes appId/productName/protocol/publish.url + dmg filename —
          # created in BET-370); prod stays on `electron-builder.yml`. The
          # overlay uses `extends:` so signing/notarization/entitlements are
          # inherited unchanged.
          set -e
          export APPLE_API_KEY="$ASC_KEY_FILE"
          export APPLE_API_KEY_ID="$ASC_API_KEY_ID"
          export APPLE_API_ISSUER="$ASC_ISSUER_ID"
          export APPLE_TEAM_ID="$APPLE_TEAM_ID"
          export MANTA_CHANNEL="${MANTA_CHANNEL:-prod}"
          npm run build
          if [ "$MANTA_CHANNEL" = "staging" ]; then
            npx electron-builder --mac --publish never -c.mac.notarize=true \
              --config electron-builder.staging.yml
          else
            npx electron-builder --mac --publish never -c.mac.notarize=true
          fi
      - name: Sign + notarize + staple the DMG itself
        script: |
          # The missing steps. Sign the DMG with the Developer ID cert, submit it
          # to the notary service as its own artifact (fast — the app inside is
          # already notarized), then staple the ticket. Without signing first,
          # notarization + staple "succeed" but Gatekeeper still rejects the DMG.
          set -e
          IDENTITY=$(security find-identity -v -p codesigning | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in keychain"; exit 1; }
          echo "Signing DMG(s) with: $IDENTITY"
          for dmg in dist/desktop/*.dmg; do
            codesign --force --timestamp --sign "$IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" \
              --key "$ASC_KEY_FILE" \
              --key-id "$ASC_API_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done
      - name: Verify notarization
        script: |
          # Assess the DMG with -t open (the "opening a downloaded file" context),
          # NOT -t install (that is for .pkg installers and reports a FALSE
          # "rejected / no usable signature" on a perfectly good DMG). The pass
          # signal a downloading user sees is 'accepted' + 'Notarized Developer ID'.
          set -e
          FAIL=0
          for dmg in dist/desktop/*.dmg; do
            echo "▸ $dmg"
            if spctl -a -vvv -t open --context context:primary-signature "$dmg" 2>&1 | grep -q "source=Notarized Developer ID"; then
              echo "  OK: Notarized Developer ID accepted."
            else
              spctl -a -vvv -t open --context context:primary-signature "$dmg" 2>&1 || true
              echo "  ⚠ Gatekeeper did NOT accept $dmg"
              FAIL=1
            fi
            xcrun stapler validate "$dmg" || { echo "  ⚠ stapler validate failed for $dmg"; FAIL=1; }
          done
          [ "$FAIL" = "0" ] || { echo "DMG verification failed."; exit 1; }
      - name: Restamp the update feed to match the stapled DMG
        script: |
          # MUST run after stapling and before publish.
          #
          # electron-builder wrote latest-mac.yml (the electron-updater feed)
          # back in the build step, recording the DMG's sha512 + size AT THAT
          # MOMENT. The "Sign + notarize + staple" step above then rewrote the
          # DMG in place — stapling embeds the notarization ticket, growing it
          # ~11KB and changing its hash. The feed was never regenerated, so it
          # described a pre-staple file that exists nowhere.
          #
          # electron-updater downloads the published DMG, verifies it against
          # the feed's sha512, mismatches, and refuses to install. Auto-update
          # was dead in EVERY notarized release (0.0.13 and 0.0.14 both shipped
          # this way) — and silently, because src/main/autoUpdate.ts only
          # console.warn()s on updater errors, so nobody saw a failure. Users
          # simply never received an update.
          set -e
          node scripts/release/restamp-update-feed.mjs dist/desktop/latest-mac.yml
      - name: Verify the feed validates against the artifacts
        script: |
          # Belt-and-braces: recompute each artifact's digest and diff it
          # against the feed we are about to publish. This is the check that
          # would have caught the broken feed at build time instead of leaving
          # it to be discovered from a user's "it never updates" report.
          set -e
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const YAML = require("yaml");
            const feedPath = "dist/desktop/latest-mac.yml";
            const feed = YAML.parse(fs.readFileSync(feedPath, "utf-8"));
            let bad = 0;
            for (const f of feed.files ?? []) {
              const p = path.join(path.dirname(feedPath), f.url);
              const buf = fs.readFileSync(p);
              const sha = crypto.createHash("sha512").update(buf).digest("base64");
              const ok = sha === f.sha512 && buf.length === f.size;
              console.log((ok ? "  OK  " : "  BAD ") + f.url);
              if (!ok) {
                console.log("       feed:   sha512=" + f.sha512 + " size=" + f.size);
                console.log("       actual: sha512=" + sha + " size=" + buf.length);
                bad++;
              }
            }
            if (bad) { console.error("Update feed does not match the artifacts — electron-updater would reject these."); process.exit(1); }
            console.log("Update feed matches every artifact.");
          '
      - name: Verify the feed offers an installable artifact (ZIP)
        script: |
          # A feed whose every digest is CORRECT can still be unusable, and was:
          # electron-updater's macOS path only installs from a zipped .app
          # (Squirrel.Mac). MacUpdater resolves it with
          # `findFile(files, "zip", ["pkg", "dmg"])` — DMG is on the EXCLUDED
          # list, not a fallback — and throws ERR_UPDATER_ZIP_FILE_NOT_FOUND
          # otherwise. `latest-mac.yml` shipped DMG-only, so every Mac's
          # download threw instantly and the error classified as "transient"
          # and was swallowed: auto-update was dead for the life of the feed
          # with no failure visible anywhere.
          #
          # The digest check above cannot catch this — it verifies the files the
          # feed names, not whether any of them can be installed. So assert the
          # property that actually matters, at build time, where it is one red
          # step instead of a silent no-op discovered from a user report.
          set -e
          node -e '
            const fs = require("node:fs");
            const YAML = require("yaml");
            const feed = YAML.parse(fs.readFileSync("dist/desktop/latest-mac.yml", "utf-8"));
            const files = (feed.files ?? []).map((f) => f.url);
            const zip = files.filter((u) => u.toLowerCase().endsWith(".zip"));
            if (zip.length === 0) {
              console.error("Update feed lists no .zip — electron-updater CANNOT install this on macOS.");
              console.error("Files in feed: " + (files.join(", ") || "(none)"));
              console.error("Fix: keep the `zip` target in electron-builder.yml mac.target.");
              process.exit(1);
            }
            console.log("Feed offers an installable artifact: " + zip.join(", "));
          '
      - name: Publish to mantaui.com (optional)
        script: |
          # Skips cleanly if no deploy key is configured, so the workflow still
          # produces downloadable Codemagic artifacts without prod access.
          #
          # CHANNEL (BET-371): all paths + the canonical *-latest.dmg name come
          # from the "Resolve + guard channel" step above (FEED_DIR,
          # DOWNLOADS_DIR, LATEST_DMG). Staging writes under /staging/ and
          # refreshes Manta-Staging-latest.dmg; prod stays on the original
          # /var/www/mantaui/{updates,downloads}/ + Manta-latest.dmg. The guard
          # step would already have failed RED if the resolved paths were
          # inconsistent with MANTA_CHANNEL — this step just trusts them.
          if [ -z "${PROD_SSH_KEY:-}" ]; then
            echo "No PROD_SSH_KEY — skipping publish. DMG is in Codemagic artifacts."
            exit 0
          fi
          set -e
          : "${MANTA_FEED_DIR:?MANTA_FEED_DIR not set — guard step must run first}"
          : "${MANTA_DOWNLOADS_DIR:?MANTA_DOWNLOADS_DIR not set — guard step must run first}"
          : "${MANTA_LATEST_DMG:?MANTA_LATEST_DMG not set — guard step must run first}"
          mkdir -p ~/.ssh
          echo "$PROD_SSH_KEY" | base64 --decode > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          SSH="ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=accept-new"
          HOST="root@91.107.196.2"
          $SSH "$HOST" "mkdir -p $MANTA_FEED_DIR $MANTA_DOWNLOADS_DIR"
          # Upload feed + binaries to the channel's update directory.
          #
          # The ZIP is what electron-updater actually downloads on macOS (see
          # the "installable artifact" guard above) — publishing the feed and
          # the DMG without it is what left auto-update inert. The DMG stays
          # here too: the feed still names it, and the verify step fails if a
          # file the feed names is missing.
          scp -i ~/.ssh/prod_key dist/desktop/latest-mac.yml "$HOST:$MANTA_FEED_DIR/"
          scp -i ~/.ssh/prod_key dist/desktop/*.dmg "$HOST:$MANTA_FEED_DIR/"
          scp -i ~/.ssh/prod_key dist/desktop/*.zip "$HOST:$MANTA_FEED_DIR/"
          # Human-facing downloads + refresh the channel's canonical latest.dmg
          # (arm64 preferred; falls back to whatever single dmg exists).
          # MUST pick the HIGHEST version, not the alphabetically-first —
          # `ls | head -1` returned 0.0.1 once both 0.0.1 and 0.0.4 were in the
          # dir, so Manta-latest.dmg silently served the OLDEST build (BET-252
          # shipped in 0.0.4 but the download link stayed on 0.0.1). Always
          # version-sort and take the tail.
          scp -i ~/.ssh/prod_key dist/desktop/*.dmg "$HOST:$MANTA_DOWNLOADS_DIR/"
          $SSH "$HOST" "cd $MANTA_DOWNLOADS_DIR && \
            latest=\$(ls -1 *arm64*.dmg 2>/dev/null | sort -V | tail -1); \
            [ -z \"\$latest\" ] && latest=\$(ls -1 *.dmg | sort -V | tail -1); \
            cp -f \"\$latest\" $MANTA_LATEST_DMG && echo \"$MANTA_LATEST_DMG -> \$latest\""
    artifacts:
      - dist/desktop/*.dmg
      # The auto-update artifact. Kept in the build artifacts (not just on
      # prod) so a broken publish can be diagnosed from the Codemagic run.
      - dist/desktop/*.zip
      - dist/desktop/latest-mac.yml

